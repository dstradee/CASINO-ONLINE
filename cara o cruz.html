<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Cara o Cruz | Spin Vía</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪙</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- LIBRERÍAS 3D Y ANIMACIÓN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        body, html {
            margin: 0; padding: 0; width: 100vw; height: 100dvh;
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overflow: hidden; display: flex; flex-direction: column;
            background-color: #050505; color: white;
            font-family: 'Montserrat', sans-serif;
            touch-action: manipulation;
        }

        .brand-via {
            color: #FFD700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4), 0 0 20px rgba(255, 215, 0, 0.2);
        }

        #toast-msg {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            background: rgba(220, 38, 38, 0.95); color: white; padding: 8px 16px;
            border-radius: 20px; font-weight: bold; font-size: 0.75rem; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 999;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }

        header { flex: 0 0 auto; height: 55px; }

        /* --- ZONA 3D CINEMATOGRÁFICA --- */
        #game-area {
            flex: 1 1 0; position: relative; display: flex; flex-direction: column;
            background: radial-gradient(circle at center, #18181b 0%, #000 100%);
            min-height: 0; overflow: hidden;
        }

        #canvas-container {
            flex: 1; width: 100%; position: relative; z-index: 10;
        }

        #result-banner {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            opacity: 0; z-index: 50; pointer-events: none; text-align: center;
            width: 100%; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #result-banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

        .banner-borde {
            color: #FFD700; text-shadow: 0 0 20px #FFD700, 0 0 40px #eab308;
            font-size: 4rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em;
        }

        #history-bar {
            position: absolute; bottom: 10px; width: 100%; text-align: center;
            font-size: 0.75rem; font-weight: bold; color: #a1a1aa; letter-spacing: 0.1em;
            z-index: 20;
        }

        /* --- CONTROLES DE APUESTA (INTOCADOS VISUALMENTE) --- */
        #controls-area {
            flex: 0 0 auto; background: #09090b; border-top: 1px solid #27272a;
            padding: 12px 16px calc(var(--safe-bottom) + 12px) 16px;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.8); z-index: 30;
        }

        .option-btn {
            background: #18181b; border: 2px solid #27272a; color: #71717a;
            border-radius: 8px; padding: 10px 0; font-weight: 900; font-size: 1rem;
            transition: all 0.2s; text-align: center; flex: 1; text-transform: uppercase;
        }
        .option-btn.selected {
            background: linear-gradient(135deg, #FFD700 0%, #b45309 100%);
            border-color: #fef08a; color: #000; box-shadow: 0 0 15px rgba(234, 179, 8, 0.4);
        }
        .borde-btn.selected {
            background: linear-gradient(135deg, #a855f7 0%, #6b21a8 100%);
            border-color: #d8b4fe; color: white; box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .bet-input {
            width: 100%; background: #000; border: 2px solid #27272a; border-radius: 8px;
            color: white; font-size: 1.5rem; font-weight: 900; text-align: center;
            padding: 8px; outline: none; transition: border-color 0.2s;
        }
        .bet-input:focus { border-color: #FFD700; }

        .spin-btn {
            width: 100%; background: linear-gradient(to bottom, #16a34a, #15803d);
            border: 1px solid #4ade80; box-shadow: 0 4px 0 #14532d;
            border-radius: 8px; padding: 14px 0; font-size: 1.25rem; font-weight: 900;
            color: white; text-transform: uppercase; letter-spacing: 0.1em;
            transition: all 0.1s;
        }
        .spin-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 0 0 #14532d; }
        .spin-btn:disabled { background: #27272a; border-color: #3f3f46; color: #71717a; box-shadow: none; transform: none; }

        .quick-bet {
            background: #18181b; border: 1px solid #3f3f46; border-radius: 4px;
            color: #a1a1aa; font-size: 0.75rem; font-weight: bold; padding: 4px 0;
            flex: 1; text-align: center;
        }
        .quick-bet:active { background: #27272a; color: white; }

        @media (max-height: 700px) {
            header { height: 45px; }
            #controls-area { padding-top: 8px; padding-bottom: calc(var(--safe-bottom) + 8px); }
            .option-btn { padding: 6px 0; font-size: 0.9rem; }
            .bet-input { font-size: 1.25rem; padding: 4px; }
            .spin-btn { padding: 10px 0; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div id="toast-msg">Mensaje</div>

    <div id="sys-loading" class="absolute inset-0 z-[200] bg-black flex flex-col items-center justify-center">
        <div class="text-5xl mb-4">🪙</div>
        <p class="text-yellow-500 font-bold uppercase tracking-widest text-sm animate-pulse">Cargando...</p>
    </div>
    <div id="sys-error" class="absolute inset-0 z-[200] bg-black flex flex-col items-center justify-center hidden">
        <h1 class="text-red-600 text-3xl font-black uppercase text-center px-4">Acceso Denegado<br><span class="text-sm text-zinc-500 mt-2 block">Vuelve al HUB</span></h1>
    </div>

    <!-- CABECERA -->
    <header class="px-3 bg-zinc-900 flex justify-between items-center border-b border-zinc-800 w-full relative z-50">
        <div class="flex items-center w-1/3 h-full gap-2">
            <button onclick="goToHub()" class="flex-none text-zinc-400 hover:text-white transition-colors px-1" title="Volver al HUB">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <div class="flex flex-col items-start justify-center overflow-hidden">
                <span class="text-[9px] text-zinc-500 uppercase font-bold leading-none mb-1">Jugador</span>
                <span id="player-name" class="text-xs font-bold text-zinc-200 truncate w-full leading-none">...</span>
            </div>
        </div>

        <div class="w-1/3 text-center">
            <h1 class="text-sm font-black tracking-widest text-white uppercase">Spin <span class="brand-via">Vía</span></h1>
        </div>

        <div class="flex flex-col items-end w-1/3 h-full justify-center">
            <span class="text-[9px] text-zinc-500 uppercase font-bold leading-none mb-1">Saldo</span>
            <span id="player-balance" class="text-sm font-black text-white truncate w-full text-right leading-none">0 <span class="text-[9px] text-zinc-400">bits</span></span>
        </div>
    </header>

    <!-- ZONA 3D (CINEMATOGRÁFICA) -->
    <div id="game-area">
        <div id="canvas-container"></div>
        
        <div id="result-banner">
            <div id="result-title" class="text-6xl font-black uppercase text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] mb-2">CARA</div>
            <div id="result-subtitle" class="text-2xl font-bold uppercase text-green-400 drop-shadow-[0_0_10px_#4ade80]">APUESTA GANADA</div>
            <div id="result-profit" class="text-sm font-bold text-white mt-2 hidden">+100 bits</div>
        </div>

        <div id="history-bar">Historial: <span id="history-text" class="text-zinc-300">...</span></div>
    </div>

    <!-- CONTROLES -->
    <div id="controls-area">
        <div class="flex gap-2 mb-4">
            <button class="option-btn" id="btn-cara" onclick="selectOption('CARA')">CARA<br><span class="text-[10px] normal-case text-zinc-400">Pago 1:1</span></button>
            <button class="option-btn borde-btn" id="btn-borde" onclick="selectOption('BORDE')">BORDE<br><span class="text-[10px] normal-case text-zinc-300">Pago 8:1</span></button>
            <button class="option-btn" id="btn-cruz" onclick="selectOption('CRUZ')">CRUZ<br><span class="text-[10px] normal-case text-zinc-400">Pago 1:1</span></button>
        </div>

        <div class="flex gap-2 items-center mb-4">
            <div class="flex-1">
                <input type="number" id="bet-input" class="bet-input" value="100" min="10" step="10" onchange="validateBet()">
            </div>
            <div class="flex flex-col gap-1 w-20">
                <button class="quick-bet" onclick="addBet(100)">+100</button>
                <button class="quick-bet" onclick="addBet(500)">+500</button>
            </div>
        </div>

        <button id="btn-lanzar" class="spin-btn" onclick="lanzarMoneda()">
            Lanzar Moneda
        </button>
    </div>

    <!-- ==========================================
         LÓGICA JAVASCRIPT
         ========================================== -->
    <script>
        /* --- SUPABASE (INTOCABLE) --- */
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let isSpinning = false;
        let selectedOption = null; 
        let currentBet = 100;
        let historyArr = [];

        /* --- VARIABLES THREE.JS --- */
        let scene, camera, renderer, coin;

        /* --- INICIALIZACIÓN --- */
        document.addEventListener('DOMContentLoaded', async () => {
            init3DScene();

            const urlParams = new URLSearchParams(window.location.search);
            const codigo = urlParams.get('codigo');
            if (!codigo) {
                document.getElementById('sys-loading').classList.add('hidden');
                document.getElementById('sys-error').classList.remove('hidden');
                return;
            }

            const { data, error } = await supabaseClient.from('usuarios').select('*').eq('codigo', codigo).single();
            if (error || !data) {
                document.getElementById('sys-loading').classList.add('hidden');
                document.getElementById('sys-error').classList.remove('hidden');
            } else {
                currentUser = data;
                document.getElementById('sys-loading').classList.add('hidden');
                updateBalanceUI();
                checkButtonState();
            }
        });

        function goToHub() {
            if (isSpinning) return;
            const urlParams = new URLSearchParams(window.location.search);
            const codigo = urlParams.get('codigo');
            if(codigo) window.location.href = `index.html?codigo=${codigo}`;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = msg;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        }

        function updateBalanceUI() {
            document.getElementById('player-name').innerText = currentUser.nombre;
            document.getElementById('player-balance').innerHTML = `${parseFloat(currentUser.saldo).toLocaleString('es-ES')} <span class="text-[9px] text-zinc-400">bits</span>`;
        }

        function updateHistory(result) {
            historyArr.push(result);
            if(historyArr.length > 5) historyArr.shift();
            document.getElementById('history-text').innerText = historyArr.join(' · ');
        }

        /* --- CONTROLES APUESTA --- */
        function selectOption(opt) {
            if (isSpinning) return;
            selectedOption = opt;
            
            document.getElementById('btn-cara').classList.remove('selected');
            document.getElementById('btn-cruz').classList.remove('selected');
            document.getElementById('btn-borde').classList.remove('selected');
            
            if(opt === 'CARA') document.getElementById('btn-cara').classList.add('selected');
            if(opt === 'CRUZ') document.getElementById('btn-cruz').classList.add('selected');
            if(opt === 'BORDE') document.getElementById('btn-borde').classList.add('selected');

            checkButtonState();
        }

        function addBet(amount) {
            if (isSpinning) return;
            currentBet += amount;
            document.getElementById('bet-input').value = currentBet;
            validateBet();
        }

        function validateBet() {
            let val = parseInt(document.getElementById('bet-input').value);
            if (isNaN(val) || val <= 0) val = 10;
            currentBet = val;
            document.getElementById('bet-input').value = currentBet;
            checkButtonState();
        }

        function checkButtonState() {
            const btn = document.getElementById('btn-lanzar');
            if (isSpinning) {
                btn.disabled = true;
                btn.innerText = "GIRANDO...";
            } else if (!selectedOption) {
                btn.disabled = true;
                btn.innerText = "SELECCIONA APUESTA";
            } else {
                btn.disabled = false;
                btn.innerText = "LANZAR MONEDA";
            }
        }

        /* --- MOTOR THREE.JS Y PROCEDURAL PREMIUM COIN --- */
        function init3DScene() {
            const container = document.getElementById('canvas-container');
            
            // 1. Escena y Cámara Cinematográfica
            scene = new THREE.Scene();
            // Ligera niebla oscura al fondo para dar profundidad de casino
            scene.fog = new THREE.Fog(0x050505, 10, 40);
            
            camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 100);
            camera.position.set(0, 10, 20); // Ángulo en picado
            camera.lookAt(0, 0, 0);

            // 2. Renderizador Premium con Sombras
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping; // Realismo lumínico
            renderer.outputEncoding = THREE.sRGBEncoding;
            container.appendChild(renderer.domElement);

            // 3. Suelo de Casino (Para recibir sombras proyectadas)
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ 
                color: 0x111111, roughness: 0.8, metalness: 0.2
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -0.5; // Suelo ligeramente debajo
            floor.receiveShadow = true;
            scene.add(floor);

            // 4. Luces Cinematográficas
            const ambient = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambient);

            // Luz principal (Key Light) dorada con sombra
            const spotLight = new THREE.SpotLight(0xfff0dd, 5);
            spotLight.position.set(-5, 20, 10);
            spotLight.angle = Math.PI / 6;
            spotLight.penumbra = 0.5;
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            spotLight.shadow.bias = -0.001;
            scene.add(spotLight);

            // Luz de borde (Rim Light) para dar volumen metálico
            const rimLight = new THREE.PointLight(0xffd700, 3, 50);
            rimLight.position.set(5, -5, -10);
            scene.add(rimLight);

            // 5. Creación de Moneda Procedural Premium (Sin GLB externo = Cero CORS)
            // Generamos mapas de normales (Relieve 3D) en memoria vía Canvas
            const mapCara = createMintedBumpMap('CARA');
            const mapCruz = createMintedBumpMap('CRUZ');
            
            // Material Physical (Más realista que Standard, permite capa transparente)
            const materialCara = new THREE.MeshPhysicalMaterial({ 
                color: 0xffd700, metalness: 1.0, roughness: 0.3,
                bumpMap: mapCara, bumpScale: 0.05,
                clearcoat: 0.3, clearcoatRoughness: 0.2
            });
            const materialCruz = new THREE.MeshPhysicalMaterial({ 
                color: 0xffd700, metalness: 1.0, roughness: 0.3,
                bumpMap: mapCruz, bumpScale: 0.05,
                clearcoat: 0.3, clearcoatRoughness: 0.2
            });
            // El canto de la moneda estriado
            const edgeTexture = createEdgeBumpMap();
            const materialEdge = new THREE.MeshPhysicalMaterial({ 
                color: 0xcca600, metalness: 1.0, roughness: 0.4,
                bumpMap: edgeTexture, bumpScale: 0.1
            });

            // Cilindro de alta resolución para imitar moneda
            const geometry = new THREE.CylinderGeometry(4, 4, 0.6, 128);
            // CylinderGeometry caras: 0: Canto, 1: Top (Cara), 2: Bottom (Cruz)
            coin = new THREE.Mesh(geometry, [materialEdge, materialCara, materialCruz]);
            coin.castShadow = true;
            coin.receiveShadow = true;
            
            // Orientación inicial (Mostrando Cara e inclinada a cámara)
            coin.rotation.x = Math.PI / 2.5; 
            coin.position.y = 0;
            
            scene.add(coin);

            // Loop
            function animate() {
                requestAnimationFrame(animate);
                if(!isSpinning) {
                    // Flote pasivo premium
                    coin.rotation.y += 0.003;
                    coin.position.y = Math.sin(Date.now() * 0.002) * 0.2;
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                if(container.clientWidth === 0) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        /* --- GENERADORES PROCEDURALES DE TEXTURA 3D (Relieve) --- */
        // Usamos Canvas para dibujar texto blanco sobre negro, 
        // lo que Three.js interpretará como "Elevado" (Blanco) y "Hundido" (Negro) en un bumpMap.
        function createMintedBumpMap(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 1024;
            const ctx = canvas.getContext('2d');
            
            // Fondo gris medio (Nivel base de la moneda)
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, 1024, 1024);

            // Borde elevado circular
            ctx.strokeStyle = '#ffffff'; // Relieve máximo
            ctx.lineWidth = 30;
            ctx.beginPath();
            ctx.arc(512, 512, 480, 0, Math.PI * 2);
            ctx.stroke();
            // Bisel interno hundido
            ctx.strokeStyle = '#404040'; // Relieve bajo
            ctx.lineWidth = 15;
            ctx.beginPath();
            ctx.arc(512, 512, 450, 0, Math.PI * 2);
            ctx.stroke();

            // Texto Marca "Spin Vía" Elevado
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 150px Montserrat, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Spin Vía', 512, 300);

            // Texto CARA / CRUZ Gigante Elevado en el centro
            ctx.font = '900 250px Montserrat, sans-serif';
            ctx.fillText(text, 512, 600);

            return new THREE.CanvasTexture(canvas);
        }

        function createEdgeBumpMap() {
            // Textura para el canto de la moneda (rayas verticales)
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#808080';
            ctx.fillRect(0,0,512,128);
            ctx.fillStyle = '#ffffff';
            for(let i=0; i<512; i+=8) {
                ctx.fillRect(i, 0, 4, 128);
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.repeat.set(10, 1); // Repite el patrón alrededor del cilindro
            return tex;
        }

        /* --- LÓGICA Y ANIMACIÓN DEL JUEGO --- */
        async function lanzarMoneda() {
            validateBet();
            if (isSpinning || !selectedOption) return;
            
            if (currentBet > currentUser.saldo) {
                showToast("Saldo insuficiente"); return;
            }

            // BLOQUEAR Y COBRAR (Transacción atómica antes de animar)
            isSpinning = true;
            checkButtonState();
            currentUser.saldo -= currentBet;
            updateBalanceUI();
            
            document.getElementById('result-banner').classList.remove('show');

            // 1. DETERMINAR RESULTADO MATEMÁTICAMENTE (INTOCABLE)
            const rand = Math.random();
            let result = '';
            // 45% CARA, 45% CRUZ, 10% BORDE
            if (rand < 0.45) result = 'CARA';
            else if (rand < 0.90) result = 'CRUZ';
            else result = 'BORDE';

            // 2. FÍSICAS GSAP: Volar, Girar y Caer
            const tl = gsap.timeline({ onComplete: () => procesarResultado(result) });
            
            // Reseteo posicional
            coin.position.set(0, 0, 0);
            coin.rotation.set(0, 0, 0);

            // Calcular Rotación Final Exacta según el resultado
            // Cylinder: Top=CARA (+Y), Bottom=CRUZ (-Y)
            let targetRotX, targetRotY = 0, targetRotZ = 0;
            const extraSpinsX = Math.PI * 2 * 10; // 10 vueltas completas vertiginosas
            const extraSpinsZ = Math.PI * 2 * 4;  // Caos en los ejes

            if (result === 'CARA') {
                targetRotX = Math.PI / 2 + extraSpinsX;
            } else if (result === 'CRUZ') {
                targetRotX = -Math.PI / 2 + extraSpinsX;
            } else {
                // BORDE: Cae de pie. 
                targetRotX = 0 + extraSpinsX; // Queda en Y=0 (Vertical)
                targetRotY = Math.PI / 6;     // Ligeramente girada hacia cámara para ver el canto y un poco de la cara
            }

            // A. Salto hacia la cámara y arriba
            tl.to(coin.position, { y: 18, z: 5, duration: 1.5, ease: "power2.out" }, 0);
            
            // B. Giro rápido en el aire (Combina X y Z para efecto esférico natural)
            tl.to(coin.rotation, { x: targetRotX / 2, z: extraSpinsZ, duration: 1.5, ease: "power1.inOut" }, 0);

            // C. Caída
            if (result === 'BORDE') {
                // El radio del cilindro es 4. Para apoyarse en el suelo (y=-0.5), pos.y debe ser aprox 3.5
                tl.to(coin.position, { y: 3.5, z: 0, duration: 1.2, ease: "bounce.out" }, 1.5);
                tl.to(coin.rotation, { x: targetRotX, y: targetRotY, z: 0, duration: 1.2, ease: "power2.out" }, 1.5);
                // Tambaleo agónico antes de frenar (Wobble)
                tl.to(coin.rotation, { z: 0.15, duration: 0.1, yoyo: true, repeat: 7, ease: "sine.inOut" }, 2.7);
                tl.to(coin.rotation, { z: 0, duration: 0.3, ease: "power2.out" }, 3.4);
            } else {
                // Cae plana. Pos Y casi 0.
                tl.to(coin.position, { y: 0, z: 0, duration: 1.5, ease: "bounce.out" }, 1.5);
                tl.to(coin.rotation, { x: targetRotX, y: 0, z: 0, duration: 1.5, ease: "power2.out" }, 1.5);
            }
        }

        /* --- PROCESAMIENTO Y PAGOS --- */
        async function procesarResultado(result) {
            updateHistory(result);

            let winAmount = 0;
            let isWin = (selectedOption === result);

            // Pagos Matemáticos Inalterados
            if (isWin) {
                if (result === 'CARA' || result === 'CRUZ') winAmount = currentBet * 2; // 1:1
                else if (result === 'BORDE') winAmount = currentBet * 9;                // 8:1
                
                currentUser.saldo += winAmount;
            }

            // Guardado en Supabase (Bloqueado por isSpinning para evitar bugs atómicos)
            const { error } = await supabaseClient.from('usuarios').update({ 
                saldo: currentUser.saldo 
            }).eq('id', currentUser.id);

            if (error) {
                showToast("Error de conexión");
                console.error(error);
            }

            updateBalanceUI();

            // PRESENTACIÓN VISUAL PREMIUM
            const banner = document.getElementById('result-banner');
            const title = document.getElementById('result-title');
            const sub = document.getElementById('result-subtitle');
            const profit = document.getElementById('result-profit');

            if (result === 'BORDE') {
                title.className = "banner-borde mb-2"; title.innerText = "¡BORDE!";
            } else {
                title.className = "text-6xl font-black uppercase text-white drop-shadow-[0_0_20px_rgba(255,255,255,0.8)] mb-2"; title.innerText = result;
            }

            if (isWin) {
                sub.className = "text-2xl font-black uppercase text-green-400 drop-shadow-[0_0_10px_#4ade80]";
                sub.innerText = "APUESTA GANADA";
                profit.innerText = `+${winAmount - currentBet} bits de beneficio`; 
                profit.classList.remove('hidden');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
            } else {
                sub.className = "text-xl font-bold uppercase text-red-500 drop-shadow-[0_0_10px_#ef4444]";
                sub.innerText = "APUESTA PERDIDA";
                profit.classList.add('hidden');
            }

            banner.classList.add('show');

            setTimeout(() => {
                isSpinning = false;
                checkButtonState();
            }, 1000);
        }
    </script>
</body>
</html>
