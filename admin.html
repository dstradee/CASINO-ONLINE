<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Casino</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        /* Ocultar el body inicial por seguridad */
        #app-container { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <!-- Mensaje si falla la contraseña -->
    <div id="auth-error" class="hidden flex h-screen items-center justify-center">
        <h1 class="text-3xl text-red-500 font-bold bg-gray-800 p-8 rounded-lg shadow-xl">Acceso Denegado</h1>
    </div>

    <!-- Contenedor Principal (Panel) -->
    <div id="app-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold text-white tracking-tight">Admin<span class="text-blue-500">Panel</span></h1>
            <p class="text-gray-400 mt-2">Gestión de jugadores y saldos</p>
        </header>

        <!-- Contenedor Alertas -->
        <div id="alert-box"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- TARJETA: FORMULARIO DE CREACIÓN (Izquierda) -->
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-6 lg:col-span-1 h-fit">
                <h2 class="text-xl font-bold text-white mb-6 border-b border-gray-700 pb-2">Nuevo Jugador</h2>
                
                <form id="createUserForm" class="space-y-5">
                    <!-- Nombre -->
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-300 mb-1">Nombre del jugador</label>
                        <input type="text" id="nombre" required placeholder="Ej: Carlos" 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- Ingreso en Euros -->
                    <div>
                        <label for="ingreso" class="block text-sm font-medium text-gray-300 mb-1">Ingreso en Euros (€)</label>
                        <input type="number" id="ingreso" required min="1" step="0.01" placeholder="Ej: 3" 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- Promoción (Bono) -->
                    <div>
                        <label for="bono" class="block text-sm font-medium text-gray-300 mb-1">Elige la promoción</label>
                        <select id="bono" required 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="sin_bono">Sin Bono (Rollover: 150 tiradas)</option>
                            <option value="con_bono">CON BONO DOBLE (Rollover: 500 tiradas)</option>
                        </select>
                    </div>

                    <!-- Botón Crear -->
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all flex justify-center items-center">
                        <span>Crear Jugador y Generar Link</span>
                    </button>
                </form>
            </div>

            <!-- TARJETA: DASHBOARD / LISTA DE USUARIOS (Derecha) -->
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-6 lg:col-span-2 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-bold text-white">Jugadores Activos</h2>
                    <button onclick="fetchUsuarios()" class="text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded">Actualizar</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm text-gray-300">
                        <thead class="text-xs text-gray-400 uppercase bg-gray-900/50">
                            <tr>
                                <th class="px-4 py-3 rounded-tl-lg">Nombre</th>
                                <th class="px-4 py-3">Código</th>
                                <th class="px-4 py-3">Saldo Actual</th>
                                <th class="px-4 py-3">Progreso Bono</th>
                                <th class="px-4 py-3 rounded-tr-lg">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuarios-tbody" class="divide-y divide-gray-700">
                            <!-- Los usuarios se insertarán aquí con JS -->
                            <tr><td colspan="5" class="text-center py-4 text-gray-500">Cargando jugadores...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // 1. CREDENCIALES DE SUPABASE
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // 2. SEGURIDAD DEL PANEL (Prompt al iniciar)
        document.addEventListener('DOMContentLoaded', () => {
            const password = prompt('Introduzca la contraseña del panel administrativo:');
            
            if (password === 'viaje2026') {
                document.getElementById('app-container').style.display = 'block';
                fetchUsuarios(); // Carga la tabla de inmediato
            } else {
                document.getElementById('auth-error').classList.remove('hidden');
                document.body.style.backgroundColor = '#111827'; // Mantener fondo oscuro
            }
        });

        // 3. GENERADOR DE CÓDIGO (5 caracteres alfanuméricos en mayúsculas)
        function generarCodigoUnico() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let codigo = '';
            for (let i = 0; i < 5; i++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return codigo;
        }

        // 4. LÓGICA DE CREACIÓN DE USUARIO (La trampa del Bono)
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Creando...';

            // Capturar datos del formulario
            const nombre = document.getElementById('nombre').value.trim();
            const ingresoEuros = parseFloat(document.getElementById('ingreso').value);
            const opcionBono = document.getElementById('bono').value;

            // Cálculos matemáticos requeridos
            const codigo = generarCodigoUnico();
            const puntos_base = ingresoEuros * 10000;
            
            let saldoFinal = 0;
            let tiradasObjetivoFinal = 0;

            if (opcionBono === 'sin_bono') {
                saldoFinal = puntos_base;
                tiradasObjetivoFinal = 150;
            } else {
                // Bono Doble
                saldoFinal = puntos_base * 2;
                tiradasObjetivoFinal = 500;
            }

            // Inserción Asíncrona a Supabase
            const { data, error } = await supabaseClient
                .from('usuarios')
                .insert([
                    { 
                        codigo: codigo, 
                        nombre: nombre, 
                        saldo: saldoFinal, 
                        tiradas_realizadas: 0, 
                        tiradas_objetivo: tiradasObjetivoFinal 
                    }
                ]);

            if (error) {
                alert('Error al crear el usuario en Supabase:\n' + error.message);
            } else {
                // Éxito: Generar Magic Link y mostrar alerta
                const urlActual = window.location.origin; // O puedes quemar "tusitio.com" si lo prefieres
                const magicLink = `tusitio.com/index.html?codigo=${codigo}`;
                
                document.getElementById('alert-box').innerHTML = `
                    <div class="bg-green-600/20 border border-green-500 p-4 rounded-lg mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <p class="text-green-400 font-bold mb-1">¡Usuario Creado con Éxito!</p>
                            <p class="text-gray-200 text-sm break-all">Magic Link: <span class="font-mono text-white select-all">${magicLink}</span></p>
                        </div>
                        <button onclick="navigator.clipboard.writeText('https://${magicLink}'); alert('¡Link Copiado!');" 
                            class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded shadow-lg transition-colors whitespace-nowrap text-sm font-bold">
                            Copiar Link
                        </button>
                    </div>
                `;
                
                e.target.reset(); // Limpiar formulario
                fetchUsuarios();  // Actualizar tabla
            }

            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<span>Crear Jugador y Generar Link</span>';
        });

        // 5. OBTENER Y PINTAR USUARIOS (Dashboard)
        async function fetchUsuarios() {
            const { data: usuarios, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .order('id', { ascending: false });

            const tbody = document.getElementById('usuarios-tbody');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-red-500">Error al cargar datos: ${error.message}</td></tr>`;
                return;
            }

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">No hay jugadores creados aún.</td></tr>`;
                return;
            }

            tbody.innerHTML = ''; // Limpiar

            usuarios.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/50 transition-colors';
                
                // Formatear saldo con puntos de miles para que sea legible
                const saldoFormateado = parseFloat(user.saldo).toLocaleString('es-ES');

                tr.innerHTML = `
                    <td class="px-4 py-4 font-medium text-white">${user.nombre}</td>
                    <td class="px-4 py-4"><span class="bg-gray-900 border border-gray-600 px-2 py-1 rounded font-mono text-yellow-400 tracking-wider">${user.codigo}</span></td>
                    <td class="px-4 py-4 font-bold text-blue-400">${saldoFormateado} pts</td>
                    <td class="px-4 py-4 text-gray-300">
                        ${user.tiradas_realizadas} / ${user.tiradas_objetivo}
                        <div class="w-full bg-gray-900 rounded-full h-1.5 mt-2">
                            <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${Math.min((user.tiradas_realizadas / user.tiradas_objetivo) * 100, 100)}%"></div>
                        </div>
                    </td>
                    <td class="px-4 py-4">
                        <button onclick="recargarSaldoRapido(${user.id})" 
                            class="bg-green-500 hover:bg-green-400 text-gray-900 font-extrabold py-1.5 px-3 rounded shadow-[0_0_10px_rgba(34,197,94,0.6)] transition-all text-xs whitespace-nowrap transform hover:scale-105 active:scale-95">
                            +1€ (10.000 pts)
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 6. BOTÓN DE RECARGA RÁPIDA (+10.000 pts)
        async function recargarSaldoRapido(userId) {
            // Primero, obtenemos el saldo actual del usuario
            const { data: userCurrent, error: fetchError } = await supabaseClient
                .from('usuarios')
                .select('saldo')
                .eq('id', userId)
                .single();

            if (fetchError) {
                alert('Error al leer saldo actual:\n' + fetchError.message);
                return;
            }

            const nuevoSaldo = parseFloat(userCurrent.saldo) + 10000;

            // Actualizamos el saldo
            const { error: updateError } = await supabaseClient
                .from('usuarios')
                .update({ saldo: nuevoSaldo })
                .eq('id', userId);

            if (updateError) {
                alert('Error al añadir saldo:\n' + updateError.message);
            } else {
                // Si va bien, volvemos a pintar la tabla para reflejar el cambio
                fetchUsuarios();
            }
        }
    </script>
</body>
</html>
