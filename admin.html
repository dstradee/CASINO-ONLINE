<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Casino</title>
    <!-- Favicon de Casino -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <!-- Contenedor Principal (Panel) -->
    <div id="app-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold text-white tracking-tight">Admin<span class="text-blue-500">Panel</span> 🎰</h1>
            <p class="text-gray-400 mt-2">Gestión de jugadores, saldos y depósitos totales</p>
        </header>

        <!-- Contenedor Alertas (Se usa al crear usuario) -->
        <div id="alert-box"></div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            
            <!-- TARJETA: FORMULARIO DE CREACIÓN (Izquierda) -->
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-6 xl:col-span-1 h-fit">
                <h2 class="text-xl font-bold text-white mb-6 border-b border-gray-700 pb-2">Nuevo Jugador</h2>
                
                <form id="createUserForm" class="space-y-5">
                    <!-- Nombre -->
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-300 mb-1">Nombre del jugador</label>
                        <input type="text" id="nombre" required placeholder="Ej: Carlos" 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- Ingreso en Euros -->
                    <div>
                        <label for="ingreso" class="block text-sm font-medium text-gray-300 mb-1">Ingreso en Euros (€)</label>
                        <input type="number" id="ingreso" required min="1" step="0.01" placeholder="Ej: 3" 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- Promoción (Bono) -->
                    <div>
                        <label for="bono" class="block text-sm font-medium text-gray-300 mb-1">Elige la promoción</label>
                        <select id="bono" required 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="sin_bono">Sin Bono (Rollover: 150 tiradas)</option>
                            <option value="con_bono">CON BONO DOBLE (Rollover: 500 tiradas)</option>
                        </select>
                    </div>

                    <!-- Botón Crear -->
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all flex justify-center items-center">
                        <span>Crear Jugador y Link</span>
                    </button>
                </form>
            </div>

            <!-- TARJETA: DASHBOARD / LISTA DE USUARIOS (Derecha) -->
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-4 sm:p-6 xl:col-span-3 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-bold text-white">Jugadores Activos</h2>
                    <button onclick="fetchUsuarios()" class="text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 px-4 py-2 rounded shadow-md transition-colors font-bold">
                        🔄 Actualizar
                    </button>
                </div>
                
                <!-- Eliminamos overflow-x-auto para que funcionen bien las tarjetas en móvil -->
                <div class="w-full">
                    <table class="min-w-full text-left text-sm text-gray-300">
                        <!-- THEAD: Visible solo en pantallas medianas/grandes -->
                        <thead class="hidden lg:table-header-group text-xs text-gray-400 uppercase bg-gray-900/50">
                            <tr>
                                <th class="px-4 py-3 rounded-tl-lg">Nombre</th>
                                <th class="px-4 py-3">Código / Link</th>
                                <th class="px-4 py-3 text-green-400">T. Ingresado</th>
                                <th class="px-4 py-3 text-blue-400">Saldo Actual</th>
                                <th class="px-4 py-3">Bono</th>
                                <th class="px-4 py-3 rounded-tr-lg">Acciones</th>
                            </tr>
                        </thead>
                        <!-- TBODY: Tarjetas en móvil, Filas en PC -->
                        <tbody id="usuarios-tbody" class="block lg:table-row-group">
                            <tr><td colspan="6" class="text-center py-4 text-gray-500">Cargando jugadores...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // 1. CREDENCIALES Y CONFIGURACIÓN
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const CASINO_BASE_URL = 'https://casino-online-git-main-pabloestram-6438s-projects.vercel.app/';

        // Cargar usuarios inmediatamente al abrir
        document.addEventListener('DOMContentLoaded', () => {
            fetchUsuarios();
        });

        // 2. GENERADOR DE CÓDIGO
        function generarCodigoUnico() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let codigo = '';
            for (let i = 0; i < 5; i++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return codigo;
        }

        // 3. CREAR USUARIO
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Creando...';

            const nombre = document.getElementById('nombre').value.trim();
            const ingresoEuros = parseFloat(document.getElementById('ingreso').value);
            const opcionBono = document.getElementById('bono').value;

            const codigo = generarCodigoUnico();
            const puntos_base = ingresoEuros * 10000;
            
            let saldoFinal = (opcionBono === 'sin_bono') ? puntos_base : (puntos_base * 2);
            let tiradasObjetivoFinal = (opcionBono === 'sin_bono') ? 150 : 500;

            const { data, error } = await supabaseClient.from('usuarios').insert([{ 
                codigo: codigo, 
                nombre: nombre, 
                saldo: saldoFinal, 
                tiradas_realizadas: 0, 
                tiradas_objetivo: tiradasObjetivoFinal,
                total_ingresado: ingresoEuros // <-- Guardamos el dinero real ingresado
            }]);

            if (error) {
                alert('Error al crear el usuario:\n' + error.message);
            } else {
                const magicLink = `${CASINO_BASE_URL}?codigo=${codigo}`;
                
                document.getElementById('alert-box').innerHTML = `
                    <div class="bg-green-600/20 border border-green-500 p-4 rounded-lg mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <p class="text-green-400 font-bold mb-1">¡Jugador Creado!</p>
                            <p class="text-gray-200 text-sm break-all">Link de acceso: <span class="font-mono text-white">${magicLink}</span></p>
                        </div>
                        <button onclick="copiarAlPortapapeles('${magicLink}')" 
                            class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded shadow-lg transition-colors whitespace-nowrap text-sm font-bold">
                            📋 Copiar Link
                        </button>
                    </div>
                `;
                e.target.reset(); 
                fetchUsuarios();  
            }

            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<span>Crear Jugador y Link</span>';
        });

        // 4. OBTENER Y PINTAR USUARIOS (Lógica Responsiva)
        async function fetchUsuarios() {
            const { data: usuarios, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .order('id', { ascending: false });

            const tbody = document.getElementById('usuarios-tbody');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-4 text-red-500">Error: ${error.message}</td></tr>`;
                return;
            }

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-500">No hay jugadores activos.</td></tr>`;
                return;
            }

            tbody.innerHTML = ''; 

            usuarios.forEach(user => {
                const tr = document.createElement('tr');
                // En móvil (block), se comporta como una tarjeta. En escritorio (lg:table-row) como fila normal.
                tr.className = 'block lg:table-row mb-6 lg:mb-0 bg-gray-900 lg:bg-transparent rounded-lg border border-gray-700 lg:border-0 lg:border-b lg:border-gray-700/50 hover:bg-gray-700/30 transition-colors p-4 lg:p-0 shadow-lg lg:shadow-none';
                
                const saldoFormateado = parseFloat(user.saldo).toLocaleString('es-ES');
                const totalIngresado = user.total_ingresado !== null ? parseFloat(user.total_ingresado).toLocaleString('es-ES') : '0';
                const magicLink = `${CASINO_BASE_URL}?codigo=${user.codigo}`;

                tr.innerHTML = `
                    <!-- Nombre -->
                    <td class="flex justify-between items-center lg:table-cell py-2 lg:py-4 lg:px-4 border-b border-gray-700 lg:border-0">
                        <span class="lg:hidden font-bold text-xs text-gray-400 uppercase">Nombre:</span>
                        <span class="font-bold text-white text-base">${user.nombre}</span>
                    </td>
                    
                    <!-- Link y Código -->
                    <td class="flex justify-between items-center lg:table-cell py-2 lg:py-4 lg:px-4 border-b border-gray-700 lg:border-0">
                        <span class="lg:hidden font-bold text-xs text-gray-400 uppercase">Código:</span>
                        <div class="flex items-center gap-2">
                            <span class="bg-gray-800 lg:bg-gray-900 border border-gray-600 px-2 py-1 rounded font-mono text-yellow-400 tracking-wider">${user.codigo}</span>
                            <button onclick="copiarAlPortapapeles('${magicLink}')" title="Copiar Link Mágico" class="text-gray-400 hover:text-white transition-colors bg-gray-800 p-1.5 rounded lg:bg-transparent lg:p-0">
                                📋
                            </button>
                        </div>
                    </td>
                    
                    <!-- Total Ingresado (NUEVO) -->
                    <td class="flex justify-between items-center lg:table-cell py-2 lg:py-4 lg:px-4 border-b border-gray-700 lg:border-0">
                        <span class="lg:hidden font-bold text-xs text-gray-400 uppercase">T. Ingresado:</span>
                        <span class="font-bold text-green-400 text-base">${totalIngresado} €</span>
                    </td>

                    <!-- Saldo -->
                    <td class="flex justify-between items-center lg:table-cell py-2 lg:py-4 lg:px-4 border-b border-gray-700 lg:border-0">
                        <span class="lg:hidden font-bold text-xs text-gray-400 uppercase">Saldo:</span>
                        <span class="font-bold text-blue-400 text-base">${saldoFormateado} pts</span>
                    </td>

                    <!-- Bono -->
                    <td class="flex flex-col gap-1 lg:table-cell py-3 lg:py-4 lg:px-4 border-b border-gray-700 lg:border-0">
                        <div class="flex justify-between lg:block">
                            <span class="lg:hidden font-bold text-xs text-gray-400 uppercase">Progreso:</span>
                            <span class="text-gray-300">${user.tiradas_realizadas} / ${user.tiradas_objetivo}</span>
                        </div>
                        <div class="w-full bg-gray-800 lg:bg-gray-900 rounded-full h-1.5 mt-1 lg:mt-2">
                            <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${Math.min((user.tiradas_realizadas / user.tiradas_objetivo) * 100, 100)}%"></div>
                        </div>
                    </td>

                    <!-- Acciones -->
                    <td class="pt-4 pb-2 lg:py-4 lg:px-4 flex flex-col lg:table-cell">
                        <span class="lg:hidden font-bold text-xs text-gray-400 uppercase mb-3">Acciones Rápidas:</span>
                        <div class="flex flex-wrap gap-2 justify-center lg:justify-start">
                            <button onclick="recargarSaldoPersonalizado(${user.id}, '${user.nombre}', ${user.saldo}, ${user.total_ingresado || 0})" title="Añadir Dinero"
                                class="flex-1 lg:flex-none bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-3 rounded shadow transition-all text-xs">
                                💰 Añadir
                            </button>
                            <button onclick="restarSaldoPersonalizado(${user.id}, '${user.nombre}', ${user.saldo}, ${user.total_ingresado || 0})" title="Restar Dinero por Error"
                                class="flex-1 lg:flex-none bg-orange-600 hover:bg-orange-500 text-white font-bold py-2 px-3 rounded shadow transition-all text-xs">
                                ➖ Restar
                            </button>
                            <button onclick="editarNombre(${user.id}, '${user.nombre}')" title="Editar Nombre"
                                class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-3 rounded shadow transition-all text-xs">
                                ✏️
                            </button>
                            <button onclick="eliminarUsuario(${user.id}, '${user.nombre}')" title="Eliminar Jugador"
                                class="bg-red-600 hover:bg-red-500 text-white font-bold py-2 px-3 rounded shadow transition-all text-xs">
                                🗑️
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. ACCIONES RÁPIDAS

        // Copiar Enlace
        function copiarAlPortapapeles(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                alert('¡Link copiado correctamente!\n' + texto);
            });
        }

        // Añadir dinero (Suma a Total Ingresado y Puntos)
        async function recargarSaldoPersonalizado(id, nombre, saldoActual, totalActual) {
            const inputEuros = prompt(`¿Cuántos EUROS REALES quieres añadir al jugador ${nombre}?\n(Ej: 2.5)`);
            
            if (inputEuros !== null && inputEuros.trim() !== '') {
                const euros = parseFloat(inputEuros.replace(',', '.')); 
                if (isNaN(euros) || euros <= 0) {
                    alert('Cantidad inválida.');
                    return;
                }

                const nuevoSaldo = parseFloat(saldoActual) + (euros * 10000);
                const nuevoTotalIngresado = parseFloat(totalActual) + euros;

                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ saldo: nuevoSaldo, total_ingresado: nuevoTotalIngresado })
                    .eq('id', id);

                if (error) alert('Error:\n' + error.message);
                else fetchUsuarios(); 
            }
        }

        // Restar dinero (Resta de Total Ingresado y Puntos)
        async function restarSaldoPersonalizado(id, nombre, saldoActual, totalActual) {
            const inputEuros = prompt(`CORRECCIÓN: ¿Cuántos EUROS le quieres QUITAR a ${nombre}?\n\n(Se le restarán los puntos equivalentes y el dinero de su Total Ingresado)`);
            
            if (inputEuros !== null && inputEuros.trim() !== '') {
                const eurosARestar = parseFloat(inputEuros.replace(',', '.')); 
                if (isNaN(eurosARestar) || eurosARestar <= 0) {
                    alert('Cantidad inválida.');
                    return;
                }

                // Asegurarnos de que el saldo y el total no bajen de cero (math.max)
                const nuevoSaldo = Math.max(0, parseFloat(saldoActual) - (eurosARestar * 10000));
                const nuevoTotalIngresado = Math.max(0, parseFloat(totalActual) - eurosARestar);

                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ saldo: nuevoSaldo, total_ingresado: nuevoTotalIngresado })
                    .eq('id', id);

                if (error) alert('Error:\n' + error.message);
                else fetchUsuarios(); 
            }
        }

        // Editar Nombre
        async function editarNombre(id, nombreActual) {
            const nuevoNombre = prompt("Modifica el nombre del jugador:", nombreActual);
            
            if (nuevoNombre !== null && nuevoNombre.trim() !== "" && nuevoNombre !== nombreActual) {
                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ nombre: nuevoNombre.trim() })
                    .eq('id', id);

                if (error) alert('Error:\n' + error.message);
                else fetchUsuarios();
            }
        }

        // Eliminar Usuario
        async function eliminarUsuario(id, nombre) {
            if (confirm(`⚠️ ¿ELIMINAR al jugador "${nombre}" permanentemente?`)) {
                const { error } = await supabaseClient.from('usuarios').delete().eq('id', id);
                if (error) alert('Error:\n' + error.message);
                else fetchUsuarios();
            }
        }
    </script>
</body>
</html>
