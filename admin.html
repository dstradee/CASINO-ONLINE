<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard Admin - Megafire Casino</title>
    
    <!-- Favicon de Ruleta nativo por código -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- PANTALLA DE CARGA GLOBAL -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center text-white">
        <div class="w-12 h-12 border-4 border-slate-700 border-t-blue-500 rounded-full animate-spin mb-4"></div>
        <p class="font-bold tracking-widest text-slate-300">Verificando sesión...</p>
    </div>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-view" class="hidden min-h-screen bg-slate-900 flex flex-col justify-center items-center p-4">
        <div class="bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-2xl w-full max-w-md">
            <div class="text-center mb-6">
                <span class="text-5xl mb-2 block">⚙️</span>
                <h1 class="text-2xl font-black text-white tracking-wider">ADMIN MEGAFIRE</h1>
                <p class="text-slate-400 text-sm mt-1">Inicia sesión para acceder al panel</p>
            </div>
            
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Email</label>
                    <input type="email" id="login-email" required class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-300 mb-1">Contraseña</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-900 border border-slate-600 text-white rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-3">
                </div>
                <div id="login-error" class="hidden text-red-500 text-sm font-semibold text-center bg-red-900/30 p-2 rounded">
                    Credenciales incorrectas
                </div>
                <button type="submit" id="btn-login" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-bold rounded-lg text-md px-5 py-3 text-center transition-colors shadow-lg mt-4">
                    Entrar al Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- PANTALLA DEL DASHBOARD (Oculta hasta loguearse) -->
    <div id="dashboard-view" class="hidden pb-10">
        <!-- Header -->
        <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
            <div class="max-w-4xl mx-auto flex justify-between items-center">
                <h1 class="text-xl font-black tracking-wider flex items-center gap-2">
                    <span>⚙️</span> ADMIN MEGAFIRE
                </h1>
                <div class="flex gap-2">
                    <button onclick="fetchUsers()" class="p-2 bg-slate-800 rounded hover:bg-slate-700 transition" title="Actualizar lista">
                        🔄
                    </button>
                    <button id="btn-logout" class="px-3 py-2 bg-red-600/80 hover:bg-red-600 rounded text-sm font-bold transition shadow" title="Cerrar sesión">
                        Cerrar Sesión
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto p-4 mt-4 grid gap-6">
            <!-- PANEL DE CREACIÓN DE USUARIOS -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">➕ Crear Jugador (Trampa Bono)</h2>
                
                <form id="create-user-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">Nombre del amigo/jugador</label>
                            <input type="text" id="input-nombre" required placeholder="Ej: Juan" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-1">Ingreso físico (€)</label>
                            <input type="number" id="input-euros" required min="1" step="0.1" placeholder="Ej: 3" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-600 mb-1">Oferta (Psicología)</label>
                        <select id="input-bono" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5">
                            <option value="sin_bono">Sin Bono (Multiplica x10,000 pts | Bloqueo: 150 tiradas)</option>
                            <option value="con_bono">CON BONO DOBLE (Doble saldo | Bloqueo: 500 tiradas)</option>
                        </select>
                    </div>

                    <button type="submit" id="btn-crear" class="w-full text-white bg-blue-600 hover:bg-blue-700 font-bold rounded-lg text-sm px-5 py-3 text-center transition-colors shadow-lg">
                        Generar Usuario y Enlace
                    </button>
                </form>

                <div id="magic-link-container" class="hidden mt-4 p-4 bg-green-50 border border-green-200 rounded-lg">
                    <p class="text-sm text-green-800 font-bold mb-1">✅ Usuario creado con éxito. Cópiale este enlace:</p>
                    <div class="flex items-center gap-2">
                        <input type="text" id="magic-link-url" readonly class="w-full bg-white border border-green-300 text-green-900 text-sm rounded-lg p-2 focus:outline-none select-all">
                    </div>
                </div>
            </section>

            <!-- LISTA DE USUARIOS ACTIVOS -->
            <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                <h2 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">👥 Jugadores Activos</h2>
                <div id="users-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="text-slate-400 text-sm col-span-full text-center py-4">Cargando jugadores...</div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN SUPABASE ---
        const SUPABASE_URL = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Vistas
        const loadingScreen = document.getElementById('loading-screen');
        const loginView = document.getElementById('login-view');
        const dashboardView = document.getElementById('dashboard-view');

        // --- 2. SISTEMA DE AUTENTICACIÓN ---
        
        // Comprobar si hay sesión activa al cargar la página
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            
            loadingScreen.classList.add('hidden'); // Ocultar spinner de carga

            if (session) {
                // Hay sesión: Mostrar dashboard y cargar datos
                loginView.classList.add('hidden');
                dashboardView.classList.remove('hidden');
                fetchUsers();
            } else {
                // No hay sesión: Mostrar login
                dashboardView.classList.add('hidden');
                loginView.classList.remove('hidden');
            }
        }

        // Listener del Formulario de Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // Evitar que la página recargue
            
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('login-error');
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            btn.disabled = true;
            btn.innerHTML = "Iniciando sesión...";
            errorMsg.classList.add('hidden');

            const { data, error } = await supabase.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                errorMsg.classList.remove('hidden');
                errorMsg.innerText = "Error: Email o contraseña incorrectos.";
                btn.disabled = false;
                btn.innerHTML = "Entrar al Dashboard";
            } else {
                // Éxito: Limpiar form y cambiar de vista
                document.getElementById('login-form').reset();
                btn.disabled = false;
                btn.innerHTML = "Entrar al Dashboard";
                checkSession(); // Reevalúa la sesión y muestra el dashboard
            }
        });

        // Listener de Cerrar Sesión
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkSession(); // Volverá a mandar al usuario a la pantalla de login
        });


        // --- 3. LÓGICA DE CREACIÓN DE USUARIOS ---
        document.getElementById('create-user-form').addEventListener('submit', async (e) => {
            e.preventDefault(); // EVITA QUE LA PÁGINA RECARGUE AL ENVIAR
            
            const btn = document.getElementById('btn-crear');
            btn.disabled = true;
            btn.innerText = "Generando...";

            const nombre = document.getElementById('input-nombre').value.trim();
            const euros = parseFloat(document.getElementById('input-euros').value);
            const bono = document.getElementById('input-bono').value;

            let saldo_inicial = euros * 10000;
            let tiradas_objetivo = 150;

            if (bono === 'con_bono') {
                saldo_inicial *= 2;
                tiradas_objetivo = 500;
            }

            const codigo = Math.random().toString(36).substring(2, 7).toUpperCase();

            const { data, error } = await supabase
                .from('usuarios')
                .insert([{
                    codigo: codigo,
                    nombre: nombre,
                    saldo: saldo_inicial,
                    tiradas_realizadas: 0,
                    tiradas_objetivo: tiradas_objetivo
                }]);

            if (error) {
                alert("Error en base de datos: " + error.message);
                btn.disabled = false;
                btn.innerText = "Generar Usuario y Enlace";
                return;
            }

            let currentPath = window.location.href;
            let basePath = currentPath.substring(0, currentPath.lastIndexOf('/'));
            const magicUrl = `${basePath}/index.html?codigo=${codigo}`;
            
            document.getElementById('magic-link-url').value = magicUrl;
            document.getElementById('magic-link-container').classList.remove('hidden');

            document.getElementById('create-user-form').reset();
            btn.disabled = false;
            btn.innerText = "Generar Usuario y Enlace";
            
            // Refrescar la lista sin recargar la página entera
            fetchUsers();
        });

        // --- 4. LÓGICA PARA MOSTRAR Y GESTIONAR USUARIOS ---
        async function fetchUsers() {
            const container = document.getElementById('users-grid');
            
            const { data: usuarios, error } = await supabase
                .from('usuarios')
                .select('*')
                .order('id', { ascending: false });

            if (error) {
                console.error("Error al obtener usuarios", error);
                container.innerHTML = '<div class="text-red-500">Error al cargar datos</div>';
                return;
            }

            if (usuarios.length === 0) {
                container.innerHTML = '<div class="text-slate-400 text-sm col-span-full">No hay jugadores todavía.</div>';
                return;
            }

            container.innerHTML = ''; 

            usuarios.forEach(user => {
                let progressRaw = (user.tiradas_realizadas / user.tiradas_objetivo) * 100;
                let progress = Math.min(progressRaw, 100).toFixed(1);

                const card = document.createElement('div');
                card.className = "bg-slate-50 border border-slate-200 rounded-lg p-4 flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-slate-800 text-lg truncate pr-2">${user.nombre}</h3>
                            <span class="bg-slate-200 text-slate-700 text-xs px-2 py-1 rounded font-mono font-bold tracking-widest">${user.codigo}</span>
                        </div>
                        
                        <div class="text-sm text-slate-600 mb-3 space-y-1">
                            <p class="flex justify-between">
                                <span>Saldo:</span> 
                                <span class="font-black text-green-600">${Math.floor(user.saldo).toLocaleString()} pts</span>
                            </p>
                            <p class="flex justify-between">
                                <span>Rollover:</span> 
                                <span class="font-semibold text-slate-800">${user.tiradas_realizadas} / ${user.tiradas_objetivo}</span>
                            </p>
                        </div>

                        <div class="w-full bg-slate-200 rounded-full h-2 mb-4">
                            <div class="bg-blue-500 h-2 rounded-full" style="width: ${progress}%"></div>
                        </div>
                    </div>

                    <button onclick="recargarSaldo('${user.id}', ${user.saldo}, this)" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-4 rounded transition-colors text-sm flex items-center justify-center gap-2 shadow">
                        💵 +10,000 pts (Recarga)
                    </button>
                `;

                container.appendChild(card);
            });
        }

        // --- 5. FUNCIÓN RECARGA RÁPIDA ---
        async function recargarSaldo(userId, saldoActual, btnElement) {
            const originalText = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = "⏳ Recargando...";
            btnElement.classList.replace('bg-emerald-500', 'bg-slate-400');

            const nuevoSaldo = saldoActual + 10000;

            const { data, error } = await supabase
                .from('usuarios')
                .update({ saldo: nuevoSaldo })
                .eq('id', userId);

            if (error) {
                alert("Error en la recarga: " + error.message);
                btnElement.disabled = false;
                btnElement.innerHTML = originalText;
                btnElement.classList.replace('bg-slate-400', 'bg-emerald-500');
                return;
            }

            fetchUsers();
        }

        // Arrancar el flujo de auth al cargar el script
        window.addEventListener('DOMContentLoaded', checkSession);
    </script>
</body>
</html>
