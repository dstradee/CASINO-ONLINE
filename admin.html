<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Megafire Casino</title>
    
    <!-- Favicon de Ruleta -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-20">

    <!-- Header Fijo -->
    <header class="bg-slate-900 text-white p-4 shadow-lg sticky top-0 z-50 flex justify-between items-center">
        <h1 class="text-xl font-black tracking-wider flex items-center gap-2">
            <span>⚙️</span> ADMIN MEGAFIRE
        </h1>
        <button onclick="fetchUsers()" class="p-3 bg-slate-800 rounded-lg hover:bg-slate-700 active:scale-95 transition shadow" title="Actualizar lista">
            🔄 Actualizar
        </button>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-2 grid gap-6">

        <!-- PANEL DE CREACIÓN DE USUARIOS -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <h2 class="text-xl font-black text-slate-900 mb-4 border-b pb-3">➕ Nuevo Jugador</h2>
            
            <form id="create-user-form" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">Nombre del amigo</label>
                        <input type="text" id="input-nombre" required placeholder="Ej: Juan" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-lg rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none block p-4">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-slate-600 mb-2">Ingreso Físico (€)</label>
                        <input type="number" id="input-euros" required min="1" step="0.1" placeholder="Ej: 5" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-lg rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none block p-4">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-2">Oferta / Bloqueo (Psicología)</label>
                    <select id="input-bono" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none block p-4">
                        <option value="sin_bono">NORMAL (x10,000 pts | Bloqueo: 150 tiradas)</option>
                        <option value="con_bono">BONO DOBLE (Doble saldo | Bloqueo: 500 tiradas)</option>
                    </select>
                </div>

                <button type="submit" id="btn-crear" class="w-full text-white bg-blue-600 active:bg-blue-800 font-black rounded-xl text-lg px-5 py-4 text-center transition-transform active:scale-95 shadow-lg mt-2">
                    CREAR Y GENERAR ENLACE
                </button>
            </form>

            <!-- Resultado: Enlace Mágico -->
            <div id="magic-link-container" class="hidden mt-5 p-4 bg-green-50 border-2 border-green-400 rounded-xl">
                <p class="text-sm text-green-800 font-black mb-2 uppercase">✅ Enlace Listo (Cópialo):</p>
                <input type="text" id="magic-link-url" readonly class="w-full bg-white border border-green-300 text-green-900 text-sm font-mono rounded-lg p-3 focus:outline-none select-all">
            </div>
        </section>

        <!-- LISTA DE USUARIOS ACTIVOS -->
        <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
            <h2 class="text-xl font-black text-slate-900 mb-4 border-b pb-3">👥 Jugadores Activos</h2>
            
            <div id="users-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="text-slate-400 text-center py-6 font-bold w-full">Cargando jugadores...</div>
            </div>
        </section>
    </main>

    <script>
        // --- 1. CONFIGURACIÓN SUPABASE (Tus credenciales exactas) ---
        const SUPABASE_URL = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- 2. LÓGICA DE CREACIÓN DE USUARIOS ---
        document.getElementById('create-user-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const btn = document.getElementById('btn-crear');
            btn.disabled = true;
            btn.innerText = "⏳ GENERANDO...";

            try {
                const nombre = document.getElementById('input-nombre').value.trim();
                const euros = parseFloat(document.getElementById('input-euros').value);
                const bono = document.getElementById('input-bono').value;

                let saldo_inicial = euros * 10000;
                let tiradas_objetivo = 150;

                if (bono === 'con_bono') {
                    saldo_inicial *= 2; 
                    tiradas_objetivo = 500; 
                }

                // Generar código aleatorio de 5 caracteres
                const codigo = Math.random().toString(36).substring(2, 7).toUpperCase();

                // Insertar en Supabase
                const { data, error } = await supabase
                    .from('usuarios')
                    .insert([{
                        codigo: codigo,
                        nombre: nombre,
                        saldo: saldo_inicial,
                        tiradas_realizadas: 0,
                        tiradas_objetivo: tiradas_objetivo
                    }]);

                if (error) throw error;

                // Generar URL dinámica limpia (cambia admin.html por index.html)
                let currentUrl = window.location.origin + window.location.pathname;
                let magicUrl = currentUrl.replace(/admin\.html$/, 'index.html') + '?codigo=' + codigo;
                
                // Si la URL actual no acaba en admin.html (ej: raiz de vercel), añadimos /index.html
                if (!currentUrl.endsWith('admin.html')) {
                    magicUrl = window.location.origin + '/index.html?codigo=' + codigo;
                }
                
                document.getElementById('magic-link-url').value = magicUrl;
                document.getElementById('magic-link-container').classList.remove('hidden');

                document.getElementById('create-user-form').reset();
                fetchUsers();
                
            } catch (err) {
                alert("❌ Error al crear: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "CREAR Y GENERAR ENLACE";
            }
        });

        // --- 3. LÓGICA PARA MOSTRAR LA LISTA DE USUARIOS ---
        async function fetchUsers() {
            const container = document.getElementById('users-grid');
            
            try {
                const { data: usuarios, error } = await supabase
                    .from('usuarios')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                if (usuarios.length === 0) {
                    container.innerHTML = '<div class="text-slate-400 font-bold text-center w-full py-6">No hay jugadores activos todavía.</div>';
                    return;
                }

                container.innerHTML = ''; 

                usuarios.forEach(user => {
                    let progressRaw = (user.tiradas_realizadas / user.tiradas_objetivo) * 100;
                    let progress = Math.min(progressRaw, 100).toFixed(1);

                    const card = document.createElement('div');
                    card.className = "bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col shadow-sm";
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-3">
                            <h3 class="font-black text-slate-800 text-xl truncate pr-2">${user.nombre}</h3>
                            <span class="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-mono font-black border border-blue-200">${user.codigo}</span>
                        </div>
                        
                        <div class="text-base text-slate-600 mb-4 space-y-2">
                            <p class="flex justify-between border-b border-slate-200 pb-1">
                                <span class="font-bold">Saldo:</span> 
                                <span class="font-black text-green-600 text-lg">${Math.floor(user.saldo).toLocaleString()} pts</span>
                            </p>
                            <p class="flex justify-between">
                                <span class="font-bold">Rollover:</span> 
                                <span class="font-bold text-slate-800">${user.tiradas_realizadas} / ${user.tiradas_objetivo}</span>
                            </p>
                            <div class="w-full bg-slate-200 rounded-full h-2.5 mt-2">
                                <div class="bg-blue-500 h-2.5 rounded-full" style="width: ${progress}%"></div>
                            </div>
                        </div>

                        <button onclick="recargarSaldo('${user.id}', ${user.saldo}, this)" class="mt-auto w-full bg-emerald-500 active:bg-emerald-600 text-white font-black py-3 px-4 rounded-xl transition-transform active:scale-95 shadow flex items-center justify-center text-lg gap-2">
                            💵 +10K pts (Recarga)
                        </button>
                    `;
                    container.appendChild(card);
                });
            } catch (err) {
                container.innerHTML = `<div class="text-red-500 font-bold text-center w-full py-6">Error al cargar datos: ${err.message}</div>`;
            }
        }

        // --- 4. FUNCIÓN RECARGA RÁPIDA (+10,000 pts) ---
        async function recargarSaldo(userId, saldoActual, btnElement) {
            const originalText = btnElement.innerHTML;
            btnElement.disabled = true;
            btnElement.innerHTML = "⏳ RECARGANDO...";
            btnElement.classList.replace('bg-emerald-500', 'bg-slate-400');

            try {
                const nuevoSaldo = saldoActual + 10000;

                const { data, error } = await supabase
                    .from('usuarios')
                    .update({ saldo: nuevoSaldo })
                    .eq('id', userId);

                if (error) throw error;

                fetchUsers();
            } catch (err) {
                alert("❌ Error en la recarga: " + err.message);
                btnElement.disabled = false;
                btnElement.innerHTML = originalText;
                btnElement.classList.replace('bg-slate-400', 'bg-emerald-500');
            }
        }

        // Cargar usuarios al entrar
        window.addEventListener('DOMContentLoaded', fetchUsers);
    </script>
</body>
</html>
