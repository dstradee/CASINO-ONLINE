<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Casino</title>
    <!-- Favicon de Casino -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <!-- Contenedor Principal (Panel) -->
    <div id="app-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold text-white tracking-tight">Admin<span class="text-blue-500">Panel</span> 🎰</h1>
            <p class="text-gray-400 mt-2">Gestión de jugadores, enlaces y saldos</p>
        </header>

        <!-- Contenedor Alertas (Se usa al crear usuario) -->
        <div id="alert-box"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- TARJETA: FORMULARIO DE CREACIÓN (Izquierda) -->
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-6 lg:col-span-1 h-fit">
                <h2 class="text-xl font-bold text-white mb-6 border-b border-gray-700 pb-2">Nuevo Jugador</h2>
                
                <form id="createUserForm" class="space-y-5">
                    <!-- Nombre -->
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-300 mb-1">Nombre del jugador</label>
                        <input type="text" id="nombre" required placeholder="Ej: Carlos" 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- Ingreso en Euros -->
                    <div>
                        <label for="ingreso" class="block text-sm font-medium text-gray-300 mb-1">Ingreso en Euros (€)</label>
                        <input type="number" id="ingreso" required min="1" step="0.01" placeholder="Ej: 3" 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                    </div>

                    <!-- Promoción (Bono) -->
                    <div>
                        <label for="bono" class="block text-sm font-medium text-gray-300 mb-1">Elige la promoción</label>
                        <select id="bono" required 
                            class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                            <option value="sin_bono">Sin Bono (Rollover: 150 tiradas)</option>
                            <option value="con_bono">CON BONO DOBLE (Rollover: 500 tiradas)</option>
                        </select>
                    </div>

                    <!-- Botón Crear -->
                    <button type="submit" 
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all flex justify-center items-center">
                        <span>Crear Jugador y Generar Link</span>
                    </button>
                </form>
            </div>

            <!-- TARJETA: DASHBOARD / LISTA DE USUARIOS (Derecha) -->
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-6 lg:col-span-2 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-bold text-white">Jugadores Activos</h2>
                    <button onclick="fetchUsuarios()" class="text-sm bg-gray-700 hover:bg-gray-600 text-gray-300 px-3 py-1 rounded">🔄 Actualizar</button>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="min-w-full text-left text-sm text-gray-300">
                        <thead class="text-xs text-gray-400 uppercase bg-gray-900/50">
                            <tr>
                                <th class="px-4 py-3 rounded-tl-lg">Nombre</th>
                                <th class="px-4 py-3">Código y Link</th>
                                <th class="px-4 py-3">Saldo Actual</th>
                                <th class="px-4 py-3">Bono</th>
                                <th class="px-4 py-3 rounded-tr-lg">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuarios-tbody" class="divide-y divide-gray-700">
                            <!-- Los usuarios se insertarán aquí con JS -->
                            <tr><td colspan="5" class="text-center py-4 text-gray-500">Cargando jugadores...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        // 1. CREDENCIALES Y CONFIGURACIÓN
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        const CASINO_BASE_URL = 'https://casino-online-git-main-pabloestram-6438s-projects.vercel.app/';

        // Cargar usuarios inmediatamente al abrir (sin contraseña)
        document.addEventListener('DOMContentLoaded', () => {
            fetchUsuarios();
        });

        // 2. GENERADOR DE CÓDIGO (5 caracteres alfanuméricos)
        function generarCodigoUnico() {
            const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let codigo = '';
            for (let i = 0; i < 5; i++) {
                codigo += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
            }
            return codigo;
        }

        // 3. LÓGICA DE CREACIÓN DE USUARIO
        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Creando...';

            const nombre = document.getElementById('nombre').value.trim();
            const ingresoEuros = parseFloat(document.getElementById('ingreso').value);
            const opcionBono = document.getElementById('bono').value;

            const codigo = generarCodigoUnico();
            const puntos_base = ingresoEuros * 10000;
            
            let saldoFinal = (opcionBono === 'sin_bono') ? puntos_base : (puntos_base * 2);
            let tiradasObjetivoFinal = (opcionBono === 'sin_bono') ? 150 : 500;

            const { data, error } = await supabaseClient.from('usuarios').insert([{ 
                codigo: codigo, 
                nombre: nombre, 
                saldo: saldoFinal, 
                tiradas_realizadas: 0, 
                tiradas_objetivo: tiradasObjetivoFinal 
            }]);

            if (error) {
                alert('Error al crear el usuario:\n' + error.message);
            } else {
                const magicLink = `${CASINO_BASE_URL}?codigo=${codigo}`;
                
                document.getElementById('alert-box').innerHTML = `
                    <div class="bg-green-600/20 border border-green-500 p-4 rounded-lg mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                        <div>
                            <p class="text-green-400 font-bold mb-1">¡Jugador Creado!</p>
                            <p class="text-gray-200 text-sm break-all">Link de acceso: <span class="font-mono text-white">${magicLink}</span></p>
                        </div>
                        <button onclick="copiarAlPortapapeles('${magicLink}')" 
                            class="bg-green-600 hover:bg-green-500 text-white px-4 py-2 rounded shadow-lg transition-colors whitespace-nowrap text-sm font-bold">
                            📋 Copiar Link
                        </button>
                    </div>
                `;
                e.target.reset(); 
                fetchUsuarios();  
            }

            btnSubmit.disabled = false;
            btnSubmit.innerHTML = '<span>Crear Jugador y Generar Link</span>';
        });

        // 4. OBTENER Y PINTAR USUARIOS
        async function fetchUsuarios() {
            const { data: usuarios, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .order('id', { ascending: false });

            const tbody = document.getElementById('usuarios-tbody');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-red-500">Error: ${error.message}</td></tr>`;
                return;
            }

            if (usuarios.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-gray-500">No hay jugadores activos.</td></tr>`;
                return;
            }

            tbody.innerHTML = ''; 

            usuarios.forEach(user => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-700/50 transition-colors border-b border-gray-700/50 last:border-0';
                
                const saldoFormateado = parseFloat(user.saldo).toLocaleString('es-ES');
                const magicLink = `${CASINO_BASE_URL}?codigo=${user.codigo}`;

                tr.innerHTML = `
                    <td class="px-4 py-4 font-medium text-white">
                        ${user.nombre}
                    </td>
                    <td class="px-4 py-4 flex items-center gap-2">
                        <span class="bg-gray-900 border border-gray-600 px-2 py-1 rounded font-mono text-yellow-400 tracking-wider">${user.codigo}</span>
                        <button onclick="copiarAlPortapapeles('${magicLink}')" title="Copiar Link Mágico" class="text-gray-400 hover:text-white transition-colors">
                            📋
                        </button>
                    </td>
                    <td class="px-4 py-4 font-bold text-blue-400">${saldoFormateado} pts</td>
                    <td class="px-4 py-4 text-gray-300">
                        ${user.tiradas_realizadas} / ${user.tiradas_objetivo}
                        <div class="w-full bg-gray-900 rounded-full h-1.5 mt-2">
                            <div class="bg-blue-500 h-1.5 rounded-full" style="width: ${Math.min((user.tiradas_realizadas / user.tiradas_objetivo) * 100, 100)}%"></div>
                        </div>
                    </td>
                    <td class="px-4 py-4">
                        <div class="flex items-center gap-2">
                            <!-- Recargar (Añadir Dinero) -->
                            <button onclick="recargarSaldoPersonalizado(${user.id}, '${user.nombre}', ${user.saldo})" title="Añadir Dinero"
                                class="bg-green-600 hover:bg-green-500 text-white font-bold py-1.5 px-3 rounded shadow transition-all text-xs">
                                💰 + Euros
                            </button>
                            <!-- Editar Nombre -->
                            <button onclick="editarNombre(${user.id}, '${user.nombre}')" title="Editar Nombre"
                                class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-1.5 px-2 rounded shadow transition-all text-xs">
                                ✏️
                            </button>
                            <!-- Eliminar -->
                            <button onclick="eliminarUsuario(${user.id}, '${user.nombre}')" title="Eliminar Jugador"
                                class="bg-red-600 hover:bg-red-500 text-white font-bold py-1.5 px-2 rounded shadow transition-all text-xs">
                                🗑️
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 5. FUNCIONES DE ACCIÓN RÁPIDA

        // Copiar enlace general
        function copiarAlPortapapeles(texto) {
            navigator.clipboard.writeText(texto).then(() => {
                alert('¡Link copiado correctamente!\n' + texto);
            });
        }

        // Recargar saldo personalizado
        async function recargarSaldoPersonalizado(id, nombre, saldoActual) {
            const inputEuros = prompt(`¿Cuántos EUROS quieres añadir al jugador ${nombre}?\n(Ejemplo: 2.5)\nRecuerda: 1€ = 10.000 pts`);
            
            if (inputEuros !== null && inputEuros.trim() !== '') {
                const euros = parseFloat(inputEuros.replace(',', '.')); // Soporte para comas o puntos
                if (isNaN(euros) || euros <= 0) {
                    alert('Por favor, introduce una cantidad válida mayor a 0.');
                    return;
                }

                const puntosAAnyadir = euros * 10000;
                const nuevoSaldo = parseFloat(saldoActual) + puntosAAnyadir;

                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ saldo: nuevoSaldo })
                    .eq('id', id);

                if (error) {
                    alert('Error al añadir saldo:\n' + error.message);
                } else {
                    fetchUsuarios(); // Refrescar tabla
                }
            }
        }

        // Editar Nombre
        async function editarNombre(id, nombreActual) {
            const nuevoNombre = prompt("Modifica el nombre del jugador:", nombreActual);
            
            if (nuevoNombre !== null && nuevoNombre.trim() !== "" && nuevoNombre !== nombreActual) {
                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ nombre: nuevoNombre.trim() })
                    .eq('id', id);

                if (error) {
                    alert('Error al editar nombre:\n' + error.message);
                } else {
                    fetchUsuarios();
                }
            }
        }

        // Eliminar Usuario
        async function eliminarUsuario(id, nombre) {
            const confirmar = confirm(`⚠️ ¿Estás seguro de que deseas ELIMINAR al jugador "${nombre}"?\nEsta acción no se puede deshacer y perderá su saldo y progreso.`);
            
            if (confirmar) {
                const { error } = await supabaseClient
                    .from('usuarios')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert('Error al eliminar jugador:\n' + error.message);
                } else {
                    fetchUsuarios();
                }
            }
        }
    </script>
</body>
</html>
