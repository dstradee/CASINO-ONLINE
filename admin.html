<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin - Megafire Casino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-white font-sans min-h-screen pb-20">

    <header class="bg-slate-950 p-4 shadow-lg sticky top-0 z-50 border-b border-slate-800">
        <h1 class="text-2xl font-black tracking-wider text-center text-blue-400">
            🎰 ADMIN CASINO
        </h1>
    </header>

    <main class="max-w-3xl mx-auto p-4 mt-4 space-y-8">

        <!-- CAJA DE CREAR JUGADOR -->
        <section class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl">
            <h2 class="text-xl font-black mb-4 text-white">➕ Crear Jugador</h2>
            
            <form id="form-crear" class="space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">NOMBRE</label>
                        <input type="text" id="nombre" required placeholder="Ej: Paco" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold focus:border-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">INGRESO (€)</label>
                        <input type="number" id="euros" required min="1" step="0.1" placeholder="Ej: 5" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold focus:border-blue-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1">TIPO DE BONO (Bloqueo)</label>
                    <select id="bono" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-3 text-white font-bold focus:border-blue-500 focus:outline-none">
                        <option value="normal">NORMAL (Saldo x 10,000 | 150 Tiradas)</option>
                        <option value="doble">BONO DOBLE (Saldo x 20,000 | 500 Tiradas)</option>
                    </select>
                </div>

                <button type="submit" id="btn-submit" class="w-full bg-blue-600 active:bg-blue-700 text-white font-black rounded-lg p-4 text-lg mt-2 transition-transform active:scale-95">
                    CREAR JUGADOR
                </button>
            </form>

            <!-- CAJA DEL ENLACE (Aparece al crear) -->
            <div id="caja-enlace" class="hidden mt-4 p-4 bg-green-900/30 border border-green-500 rounded-lg">
                <p class="text-green-400 font-bold text-sm mb-2">✅ JUGADOR CREADO. COPIA ESTE ENLACE:</p>
                <input type="text" id="link-generado" readonly class="w-full bg-slate-950 text-green-400 border border-green-700 rounded p-3 font-mono text-sm select-all">
            </div>
        </section>

        <!-- CAJA DE LISTA DE JUGADORES -->
        <section>
            <h2 class="text-xl font-black mb-4 text-white">👥 Jugadores Activos</h2>
            <div id="lista-jugadores" class="space-y-4">
                <p class="text-slate-500 text-center py-4">Cargando base de datos...</p>
            </div>
        </section>

    </main>

    <script>
        // --- 1. CONEXIÓN A SUPABASE ---
        const URL = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const KEY = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabase = window.supabase.createClient(URL, KEY);

        // --- 2. CARGAR JUGADORES (AL INSTANTE) ---
        async function cargarJugadores() {
            const contenedor = document.getElementById('lista-jugadores');
            
            try {
                // Hacemos la consulta ordenando por el más nuevo primero
                const { data, error } = await supabase
                    .from('usuarios')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (data.length === 0) {
                    contenedor.innerHTML = '<p class="text-slate-500 text-center py-4">No hay jugadores creados.</p>';
                    return;
                }

                contenedor.innerHTML = ''; // Limpiamos la lista

                // Dibujamos cada jugador
                data.forEach(jugador => {
                    let progreso = Math.min((jugador.tiradas_realizadas / jugador.tiradas_objetivo) * 100, 100).toFixed(1);

                    contenedor.innerHTML += `
                        <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-lg">
                            <div class="flex justify-between items-start mb-2">
                                <h3 class="font-black text-xl text-white uppercase">${jugador.nombre}</h3>
                                <span class="bg-slate-950 text-blue-400 px-2 py-1 rounded font-mono text-sm border border-slate-700">${jugador.codigo}</span>
                            </div>
                            
                            <div class="mb-4 text-sm font-bold text-slate-300">
                                <p class="flex justify-between mb-1"><span>Saldo:</span> <span class="text-green-400 text-lg">${jugador.saldo} pts</span></p>
                                <p class="flex justify-between"><span>Tiradas:</span> <span>${jugador.tiradas_realizadas} / ${jugador.tiradas_objetivo}</span></p>
                                <div class="w-full bg-slate-900 rounded-full h-2 mt-2">
                                    <div class="bg-blue-500 h-2 rounded-full" style="width: ${progreso}%"></div>
                                </div>
                            </div>

                            <div class="flex gap-2">
                                <button onclick="recargar(${jugador.saldo}, '${jugador.id}')" class="flex-1 bg-green-600 active:bg-green-700 text-white font-black py-3 rounded-lg active:scale-95 transition-transform">
                                    💵 +10K pts
                                </button>
                                <button onclick="borrarJugador('${jugador.id}')" class="bg-red-600 active:bg-red-700 text-white font-black px-4 rounded-lg active:scale-95 transition-transform">
                                    🗑️ Borrar
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                contenedor.innerHTML = `<p class="text-red-500 text-center font-bold">Error conectando a Supabase: ${error.message}</p>`;
            }
        }

        // --- 3. CREAR JUGADOR ---
        document.getElementById('form-crear').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            btn.innerText = "⏳ CREANDO...";
            btn.disabled = true;

            try {
                const nombre = document.getElementById('nombre').value.trim();
                const euros = parseFloat(document.getElementById('euros').value);
                const tipoBono = document.getElementById('bono').value;

                let saldo = euros * 10000;
                let tiradas = 150;

                if (tipoBono === 'doble') {
                    saldo = euros * 20000; // Doble de pasta
                    tiradas = 500; // Bloqueo de 500 tiradas
                }

                // Generar código aleatorio de 5 letras
                const codigo = Math.random().toString(36).substring(2, 7).toUpperCase();

                // Insertar en base de datos. IMPORTANTE: usamos .select() para confirmar que se ha guardado.
                const { data, error } = await supabase
                    .from('usuarios')
                    .insert([{ codigo: codigo, nombre: nombre, saldo: saldo, tiradas_realizadas: 0, tiradas_objetivo: tiradas }])
                    .select();

                if (error) throw error;

                // Generamos el Magic Link (Asumiendo que el juego está en index.html)
                let rutaBase = window.location.origin + window.location.pathname.replace('admin.html', '');
                if (!rutaBase.endsWith('/')) rutaBase += '/';
                let enlace = `${rutaBase}index.html?codigo=${codigo}`;

                document.getElementById('link-generado').value = enlace;
                document.getElementById('caja-enlace').classList.remove('hidden');
                
                document.getElementById('form-crear').reset();
                
                // ¡LA MAGIA! Cargamos la lista de nuevo inmediatamente para que aparezca sin recargar la web
                cargarJugadores();

            } catch (error) {
                alert("Error al crear: " + error.message);
            } finally {
                btn.innerText = "CREAR JUGADOR";
                btn.disabled = false;
            }
        });

        // --- 4. RECARGAR SALDO ---
        async function recargar(saldoActual, id) {
            try {
                const { error } = await supabase
                    .from('usuarios')
                    .update({ saldo: saldoActual + 10000 })
                    .eq('id', id);

                if (error) throw error;
                
                // Refrescamos al instante
                cargarJugadores();
            } catch (error) {
                alert("Error al recargar: " + error.message);
            }
        }

        // --- 5. BORRAR JUGADOR (NUEVO) ---
        async function borrarJugador(id) {
            const confirmar = confirm("¿Estás seguro de que quieres BORRAR a este jugador?");
            if (!confirmar) return;

            try {
                const { error } = await supabase
                    .from('usuarios')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                
                // Refrescamos al instante
                cargarJugadores();
            } catch (error) {
                alert("Error al borrar: " + error.message);
            }
        }

        // Ejecutar al abrir la página
        window.addEventListener('DOMContentLoaded', cargarJugadores);
    </script>
</body>
</html>
