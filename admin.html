<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Casino</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <div id="app-container" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <header class="mb-8">
            <h1 class="text-4xl font-extrabold text-white tracking-tight">Admin<span class="text-blue-500">Panel</span> 🎰</h1>
            <p class="text-gray-400 mt-2">Gestión de jugadores, saldos y depósitos totales</p>
        </header>

        <div id="alert-box"></div>

        <div class="grid grid-cols-1 xl:grid-cols-4 gap-8">
            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-6 xl:col-span-1 h-fit">
                <h2 class="text-xl font-bold text-white mb-6 border-b border-gray-700 pb-2">Nuevo Jugador</h2>
                <form id="createUserForm" class="space-y-5">
                    <div>
                        <label for="nombre" class="block text-sm font-medium text-gray-300 mb-1">Nombre</label>
                        <input type="text" id="nombre" required placeholder="Ej: Carlos" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="ingreso" class="block text-sm font-medium text-gray-300 mb-1">Ingreso (€)</label>
                        <input type="number" id="ingreso" required min="0.5" max="5" step="0.01" placeholder="Max: 5€" class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label for="bono" class="block text-sm font-medium text-gray-300 mb-1">Promoción</label>
                        <select id="bono" required class="w-full bg-gray-900 border border-gray-600 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="sin_bono">Sin Bono</option>
                            <option value="con_bono">CON BONO (x2)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-[0_0_15px_rgba(37,99,235,0.5)] transition-all">Crear Jugador</button>
                </form>
            </div>

            <div class="bg-gray-800 rounded-xl shadow-lg border border-gray-700 p-4 sm:p-6 xl:col-span-3 overflow-hidden flex flex-col">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-2">
                    <h2 class="text-xl font-bold text-white">Jugadores Activos</h2>
                    <button onclick="fetchUsuarios()" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded shadow-md font-bold">🔄 Actualizar</button>
                </div>
                <div class="w-full">
                    <table class="min-w-full text-left text-sm text-gray-300">
                        <thead class="hidden lg:table-header-group text-xs text-gray-400 uppercase bg-gray-900/50">
                            <tr>
                                <th class="px-4 py-3">Nombre</th>
                                <th class="px-4 py-3">Código</th>
                                <th class="px-4 py-3 text-green-400">T. Ingresado</th>
                                <th class="px-4 py-3 text-blue-400">Saldo</th>
                                <th class="px-4 py-3 text-orange-400">Tipo</th>
                                <th class="px-4 py-3">Rollover</th>
                                <th class="px-4 py-3">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="usuarios-tbody" class="block lg:table-row-group">
                            <tr><td colspan="7" class="text-center py-4 text-gray-500">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient('https://qutkwzjchchhbqfhtaxi.supabase.co', 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1');
        const CASINO_BASE_URL = 'https://casino-online-git-main-pabloestram-6438s-projects.vercel.app/';

        document.addEventListener('DOMContentLoaded', fetchUsuarios);

        function generarCodigoUnico() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; let codigo = '';
            for (let i = 0; i < 5; i++) codigo += chars.charAt(Math.floor(Math.random() * chars.length));
            return codigo;
        }

        // COPIAR LINK/CÓDIGO (NUEVA FUNCIÓN RECUPERADA)
        function copiarLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                alert('¡Código copiado correctamente!\n' + link);
            });
        }

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button'); btn.disabled = true; btn.innerHTML = 'Creando...';

            const nombre = document.getElementById('nombre').value.trim();
            const ingresoEuros = parseFloat(document.getElementById('ingreso').value);
            const opcionBono = document.getElementById('bono').value;

            const codigo = generarCodigoUnico();
            const puntos_base = ingresoEuros * 10000;
            
            let saldoFinal = (opcionBono === 'sin_bono') ? puntos_base : (puntos_base * 2);
            let tiradasFinal = (opcionBono === 'sin_bono') ? Math.round(ingresoEuros * 100) : Math.round(ingresoEuros * 350);
            let checkBono = (opcionBono === 'con_bono');

            const { data, error } = await supabaseClient.from('usuarios').insert([{ 
                codigo: codigo, nombre: nombre, saldo: saldoFinal, 
                tiradas_realizadas: 0, tiradas_objetivo: tiradasFinal,
                total_ingresado: ingresoEuros, tiene_bono: checkBono
            }]);

            if (error) alert('Error: ' + error.message);
            else {
                const link = `${CASINO_BASE_URL}?codigo=${codigo}`;
                // CÓDIGO VISIBLE PERMANENTEMENTE TRAS CREAR
                document.getElementById('alert-box').innerHTML = `
                    <div class="bg-green-600/20 border border-green-500 p-4 rounded mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
                        <div>
                            <p class="text-green-400 font-bold mb-1">¡Jugador Creado!</p>
                            <p class="text-sm text-white">Código del jugador: <span class="font-mono text-yellow-400 text-lg ml-2">[ ${codigo} ]</span></p>
                        </div>
                        <button onclick="copiarLink('${link}')" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded text-sm font-bold shadow transition-colors whitespace-nowrap">📋 COPIAR CÓDIGO</button>
                    </div>`;
                e.target.reset(); fetchUsuarios();  
            }
            btn.disabled = false; btn.innerHTML = 'Crear Jugador';
        });

        async function fetchUsuarios() {
            const { data: usuarios, error } = await supabaseClient.from('usuarios').select('*').order('id', { ascending: false });
            const tbody = document.getElementById('usuarios-tbody');
            if (error) return tbody.innerHTML = `<tr><td colspan="7" class="text-center text-red-500">Error: ${error.message}</td></tr>`;
            if (usuarios.length === 0) return tbody.innerHTML = `<tr><td colspan="7" class="text-center">No hay jugadores</td></tr>`;
            
            tbody.innerHTML = ''; 
            usuarios.forEach(u => {
                const tr = document.createElement('tr');
                tr.className = 'block lg:table-row mb-6 lg:mb-0 bg-gray-900 lg:bg-transparent rounded-lg border border-gray-700 lg:border-0 lg:border-b p-4 lg:p-0';
                
                const tIngresado = u.total_ingresado !== null ? parseFloat(u.total_ingresado).toLocaleString('es-ES') : '0';
                const sFormateado = parseFloat(u.saldo).toLocaleString('es-ES');
                const tipoTxt = u.tiene_bono ? 'BONO (x2)' : 'Normal';
                const link = `${CASINO_BASE_URL}?codigo=${u.codigo}`;
                
                tr.innerHTML = `
                    <td class="lg:py-4 px-2 lg:px-4 font-bold flex lg:table-cell justify-between"><span class="lg:hidden text-xs text-gray-500 uppercase">Nombre:</span> ${u.nombre}</td>
                    
                    <!-- BOTÓN COPIAR SIEMPRE ACCESIBLE EN LA TABLA -->
                    <td class="lg:py-4 px-2 lg:px-4 flex lg:table-cell justify-between items-center gap-2 mt-2 lg:mt-0">
                        <span class="lg:hidden text-xs text-gray-500 uppercase">Código:</span>
                        <div class="flex items-center gap-2">
                            <span class="font-mono text-yellow-400">[ ${u.codigo} ]</span>
                            <button onclick="copiarLink('${link}')" class="bg-gray-700 hover:bg-gray-600 text-white px-2 py-1 rounded text-xs" title="Copiar Link de Acceso">📋</button>
                        </div>
                    </td>
                    
                    <td class="lg:py-4 px-2 lg:px-4 text-green-400 font-bold flex lg:table-cell justify-between mt-2 lg:mt-0"><span class="lg:hidden text-xs text-gray-500 uppercase">Ingresado:</span> ${tIngresado} €</td>
                    <td class="lg:py-4 px-2 lg:px-4 text-blue-400 font-bold flex lg:table-cell justify-between mt-2 lg:mt-0"><span class="lg:hidden text-xs text-gray-500 uppercase">Saldo:</span> ${sFormateado} pts</td>
                    <td class="lg:py-4 px-2 lg:px-4 text-orange-400 text-xs font-bold flex lg:table-cell justify-between mt-2 lg:mt-0"><span class="lg:hidden text-gray-500 uppercase">Tipo:</span> ${tipoTxt}</td>
                    
                    <td class="lg:py-4 px-2 lg:px-4 text-gray-300 text-xs flex flex-col lg:table-cell mt-2 lg:mt-0">
                        <div class="flex justify-between lg:block">
                            <span class="lg:hidden text-gray-500 uppercase">Rollover:</span>
                            <span>${u.tiradas_realizadas}/${u.tiradas_objetivo}</span>
                        </div>
                        <div class="w-full bg-gray-800 rounded-full h-1 mt-1"><div class="bg-blue-500 h-1 rounded-full" style="width: ${Math.min((u.tiradas_realizadas/u.tiradas_objetivo)*100,100)}%"></div></div>
                    </td>
                    
                    <!-- BOTONES AÑADIR/QUITAR RECUPERADOS -->
                    <td class="lg:py-4 px-2 lg:px-4 flex flex-wrap justify-center lg:justify-start gap-2 mt-4 lg:mt-0 border-t border-gray-700 lg:border-0 pt-4 lg:pt-0">
                        <button onclick="recargarSaldoPersonalizado(${u.id}, '${u.nombre}', ${u.saldo}, ${u.total_ingresado || 0})" title="Añadir Dinero" class="bg-green-600 hover:bg-green-500 px-3 py-1.5 rounded text-xs font-bold flex-1 lg:flex-none">💰+</button>
                        <button onclick="restarSaldoPersonalizado(${u.id}, '${u.nombre}', ${u.saldo}, ${u.total_ingresado || 0})" title="Quitar Dinero" class="bg-orange-600 hover:bg-orange-500 px-3 py-1.5 rounded text-xs font-bold flex-1 lg:flex-none">➖-</button>
                        <button onclick="editarNombre(${u.id}, '${u.nombre}')" title="Editar Nombre" class="bg-blue-600 hover:bg-blue-500 px-3 py-1.5 rounded text-xs flex-none">✏️</button>
                        <button onclick="eliminarUsuario(${u.id})" title="Eliminar Jugador" class="bg-red-600 hover:bg-red-500 px-3 py-1.5 rounded text-xs flex-none">🗑️</button>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        // FUNCIONES AÑADIR Y QUITAR RECUPERADAS INTACTAS
        async function recargarSaldoPersonalizado(id, nombre, saldoActual, totalActual) {
            const inputEuros = prompt(`¿Cuántos EUROS REALES quieres añadir al jugador ${nombre}?\n(Ej: 2.5)`);
            if (inputEuros !== null && inputEuros.trim() !== '') {
                const euros = parseFloat(inputEuros.replace(',', '.')); 
                if (isNaN(euros) || euros <= 0) {
                    alert('Cantidad inválida.');
                    return;
                }
                const nuevoSaldo = parseFloat(saldoActual) + (euros * 10000);
                const nuevoTotalIngresado = parseFloat(totalActual) + euros;

                const { error } = await supabaseClient.from('usuarios').update({ saldo: nuevoSaldo, total_ingresado: nuevoTotalIngresado }).eq('id', id);
                if (error) alert('Error:\n' + error.message);
                else fetchUsuarios(); 
            }
        }

        async function restarSaldoPersonalizado(id, nombre, saldoActual, totalActual) {
            const inputEuros = prompt(`CORRECCIÓN: ¿Cuántos EUROS le quieres QUITAR a ${nombre}?`);
            if (inputEuros !== null && inputEuros.trim() !== '') {
                const eurosARestar = parseFloat(inputEuros.replace(',', '.')); 
                if (isNaN(eurosARestar) || eurosARestar <= 0) {
                    alert('Cantidad inválida.');
                    return;
                }
                const nuevoSaldo = Math.max(0, parseFloat(saldoActual) - (eurosARestar * 10000));
                const nuevoTotalIngresado = Math.max(0, parseFloat(totalActual) - eurosARestar);

                const { error } = await supabaseClient.from('usuarios').update({ saldo: nuevoSaldo, total_ingresado: nuevoTotalIngresado }).eq('id', id);
                if (error) alert('Error:\n' + error.message);
                else fetchUsuarios(); 
            }
        }

        async function editarNombre(id, nActual) {
            const nn = prompt("Nombre:", nActual);
            if (nn && nn.trim() !== "" && nn !== nActual) {
                await supabaseClient.from('usuarios').update({ nombre: nn.trim() }).eq('id', id); fetchUsuarios();
            }
        }

        async function eliminarUsuario(id) {
            if (confirm(`⚠️ ¿ELIMINAR PERMANENTEMENTE?`)) {
                await supabaseClient.from('usuarios').delete().eq('id', id); fetchUsuarios();
            }
        }
    </script>
</body>
</html>
