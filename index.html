<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Meta viewport estricto para evitar zoom y dar sensación de App Nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Slots</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Desactivar selección de texto y comportamientos web nativos */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior-y: contain; /* Evita el pull-to-refresh en móviles */
        }

        /* Animación para el giro de la tragaperras */
        @keyframes spin-blur {
            0% { transform: translateY(0); filter: blur(0px); }
            10% { filter: blur(4px); }
            50% { transform: translateY(100px); filter: blur(8px); opacity: 0; }
            50.1% { transform: translateY(-100px); }
            90% { filter: blur(4px); }
            100% { transform: translateY(0); filter: blur(0px); opacity: 1; }
        }
        .animate-spin-slot {
            animation: spin-blur 0.15s linear infinite;
        }

        /* Animaciones para premios */
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes mega-fire {
            0% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #f59e0b, 0 0 40px #d97706; transform: scale(1); }
            50% { text-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b, 0 0 60px #d97706; transform: scale(1.1); }
            100% { text-shadow: 0 0 10px #fbbf24, 0 0 20px #f59e0b, 0 0 40px #d97706; transform: scale(1); }
        }
        
        .win-false { color: #4ade80; animation: pop-in 0.4s ease-out; text-shadow: 0 0 15px rgba(74, 222, 128, 0.5); }
        .win-normal { color: #22c55e; animation: pop-in 0.4s ease-out; text-shadow: 0 0 20px rgba(34, 197, 94, 0.7); }
        .win-mega { color: #fbbf24; font-weight: 900; font-size: 3rem; animation: pop-in 0.4s ease-out, mega-fire 1s infinite alternate; }
        .loss-text { color: #64748b; font-size: 1.5rem; transition: all 0.3s; }
    </style>
</head>
<body class="bg-slate-900 text-white h-screen w-screen overflow-hidden flex flex-col items-center justify-center font-sans">

    <!-- 1. PANTALLA DE CARGA -->
    <div id="loading-screen" class="absolute inset-0 z-50 bg-slate-900 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-slate-400 text-sm tracking-widest uppercase animate-pulse">Conectando...</p>
    </div>

    <!-- 2. PANTALLA DE ERROR / ACCESO DENEGADO -->
    <div id="error-screen" class="absolute inset-0 z-40 bg-black flex flex-col items-center justify-center hidden">
        <h1 class="text-red-600 text-4xl font-extrabold mb-2 uppercase tracking-tighter">Acceso Denegado</h1>
        <p class="text-slate-500 text-center px-6">Enlace inválido o código inexistente.</p>
    </div>

    <!-- 3. APP PRINCIPAL -->
    <div id="app-screen" class="w-full max-w-md h-full mx-auto flex flex-col relative hidden bg-gradient-to-b from-slate-900 via-slate-800 to-slate-900">
        
        <!-- HEADER -->
        <header class="p-4 border-b border-slate-700 bg-slate-900/80 backdrop-blur-sm z-10">
            <div class="flex justify-between items-center mb-3">
                <div class="flex flex-col">
                    <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Jugador</span>
                    <span id="player-name" class="text-lg font-bold text-white truncate max-w-[150px]">Cargando...</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-xs text-slate-400 uppercase font-bold tracking-wider">Saldo</span>
                    <span id="player-balance" class="text-2xl font-black text-blue-400 drop-shadow-md">0</span>
                </div>
            </div>

            <!-- BARRA DE PROGRESO (ROLLOVER) -->
            <div class="w-full bg-slate-800 rounded-full h-2 mb-1 overflow-hidden border border-slate-700 relative">
                <div id="progress-bar" class="bg-gradient-to-r from-blue-600 to-blue-400 h-2 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between items-center">
                <span id="progress-text" class="text-xs font-bold text-slate-300">Progreso: 0.0%</span>
                
                <!-- BOTÓN RETIRO (Oculto por defecto) -->
                <button id="withdraw-btn" onclick="alert('Contacta por WhatsApp para tramitar tu retiro de dinero.');" class="hidden text-[10px] bg-green-500 hover:bg-green-400 text-slate-900 font-extrabold px-3 py-1 rounded shadow-[0_0_10px_rgba(34,197,94,0.5)] uppercase tracking-wider transition-all animate-pulse">
                    Solicitar Retiro
                </button>
            </div>
        </header>

        <!-- ZONA DE JUEGO (TRAGAPERRAS) -->
        <main class="flex-1 flex flex-col items-center justify-center relative p-6">
            
            <!-- Marco de la máquina -->
            <div class="w-full aspect-square max-w-[320px] bg-slate-900 border-4 border-slate-700 rounded-2xl shadow-[0_0_50px_rgba(0,0,0,0.8)] inset-0 flex items-center justify-center relative overflow-hidden">
                <!-- Luces decorativas (bordes) -->
                <div class="absolute inset-0 border-[6px] border-slate-800 rounded-xl pointer-events-none"></div>
                
                <!-- Contenedor del resultado -->
                <div id="slot-display" class="text-5xl font-black text-white text-center flex flex-col items-center justify-center transition-all duration-300">
                    <span class="text-slate-600 text-6xl">🎰</span>
                    <span class="text-sm text-slate-500 mt-4 uppercase tracking-widest">Listo para tirar</span>
                </div>
            </div>
            
        </main>

        <!-- BOTÓN DE ACCIÓN FIJO ABAJO -->
        <div class="p-4 bg-slate-900 border-t border-slate-800 pb-8">
            <button id="spin-btn" class="w-full h-20 bg-gradient-to-b from-red-500 to-red-700 active:from-red-700 active:to-red-900 rounded-xl shadow-[0_8px_0_#7f1d1d,0_15px_20px_rgba(0,0,0,0.5)] active:shadow-[0_0px_0_#7f1d1d,0_5px_10px_rgba(0,0,0,0.5)] active:translate-y-2 transition-all flex flex-col items-center justify-center select-none" style="-webkit-tap-highlight-color: transparent;">
                <span class="text-3xl font-black text-white tracking-widest drop-shadow-md">TIRAR</span>
                <span class="text-sm font-bold text-red-200/80 tracking-widest uppercase">Coste: 100 pts</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // 1. CONFIGURACIÓN SUPABASE
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // 2. VARIABLES GLOBALES DE ESTADO
        let currentUser = null;
        let isSpinning = false;
        const COSTO_TIRADA = 100;

        // Elementos del DOM
        const elLoading = document.getElementById('loading-screen');
        const elError = document.getElementById('error-screen');
        const elApp = document.getElementById('app-screen');
        
        const elName = document.getElementById('player-name');
        const elBalance = document.getElementById('player-balance');
        const elProgress = document.getElementById('progress-bar');
        const elProgressText = document.getElementById('progress-text');
        const elWithdrawBtn = document.getElementById('withdraw-btn');
        
        const elSlot = document.getElementById('slot-display');
        const elSpinBtn = document.getElementById('spin-btn');

        // 3. INICIALIZACIÓN (LEER CÓDIGO)
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo');

            if (!codigoUrl) {
                showError();
                return;
            }

            // Consultar a Supabase
            const { data, error } = await supabaseClient
                .from('usuarios')
                .select('*')
                .eq('codigo', codigoUrl)
                .single();

            if (error || !data) {
                showError();
            } else {
                currentUser = data;
                startApp();
            }
        });

        function showError() {
            elLoading.classList.add('hidden');
            elError.classList.remove('hidden');
        }

        function startApp() {
            elLoading.classList.add('hidden');
            elApp.classList.remove('hidden');
            updateUI();
        }

        // 4. ACTUALIZAR INTERFAZ
        function updateUI() {
            // Nombre y Saldo
            elName.textContent = currentUser.nombre;
            elBalance.textContent = parseFloat(currentUser.saldo).toLocaleString('es-ES');

            // Calcular Rollover (Progreso)
            let porcentaje = (currentUser.tiradas_realizadas / currentUser.tiradas_objetivo) * 100;
            if (porcentaje > 100) porcentaje = 100;

            elProgress.style.width = `${porcentaje}%`;
            elProgressText.textContent = `Progreso: ${porcentaje.toFixed(1)}%`;

            // Mostrar botón de retiro si llegó al 100%
            if (porcentaje >= 100) {
                elProgress.classList.replace('from-blue-600', 'from-green-500');
                elProgress.classList.replace('to-blue-400', 'to-green-400');
                elWithdrawBtn.classList.remove('hidden');
            } else {
                elWithdrawBtn.classList.add('hidden');
            }
        }

        // 5. LÓGICA MATEMÁTICA Y PSICOLÓGICA (LAS FASES)
        function getResultadoTirada(tiradas) {
            const rand = Math.random();
            let premio = 0;
            let tipo = '';
            let texto = '';

            // FASE 1: Tirada 1 a la 50
            if (tiradas <= 50) {
                if (rand < 0.20) { // 20%
                    premio = 0; tipo = 'loss'; texto = 'CASI...';
                } else if (rand < 0.50) { // 30% (Falso ganar)
                    premio = 30; tipo = 'false-win'; texto = '¡PREMIO! +30';
                } else if (rand < 0.90) { // 40%
                    premio = 120; tipo = 'win-normal'; texto = '¡GANADOR! +120';
                } else { // 10%
                    premio = 500; tipo = 'win-mega'; texto = '¡MEGAFIRE! +500';
                }
            } 
            // FASE 2: Tirada 51 en adelante (Desangre)
            else {
                if (rand < 0.50) { // 50%
                    premio = 0; tipo = 'loss'; texto = 'CASI...';
                } else if (rand < 0.90) { // 40% (Falso ganar)
                    premio = 30; tipo = 'false-win'; texto = '¡PREMIO! +30';
                } else if (rand < 0.98) { // 8%
                    premio = 120; tipo = 'win-normal'; texto = '¡GANADOR! +120';
                } else { // 2%
                    premio = 500; tipo = 'win-mega'; texto = '¡MEGAFIRE! +500';
                }
            }

            return { premio, tipo, texto };
        }

        // 6. EJECUCIÓN DE LA TIRADA
        elSpinBtn.addEventListener('click', async () => {
            // Prevenir doble click y validación de saldo
            if (isSpinning) return;
            if (currentUser.saldo < COSTO_TIRADA) {
                elSlot.innerHTML = `<span class="text-red-500 text-3xl uppercase font-bold text-center">Saldo<br>Insuficiente</span>`;
                return;
            }

            // 1. Bloquear botón e iniciar lógicas
            isSpinning = true;
            elSpinBtn.style.opacity = '0.5';

            // 2. Descuento Inmediato (Ilusión de velocidad)
            currentUser.saldo -= COSTO_TIRADA;
            currentUser.tiradas_realizadas += 1;
            updateUI(); // Se resta el dinero del DOM al instante

            // 3. Determinar premio matemático
            const resultado = getResultadoTirada(currentUser.tiradas_realizadas);
            
            // 4. Animación CSS "Girando"
            elSlot.innerHTML = `<span class="text-6xl animate-spin-slot">🎰</span>`;
            
            // Efecto de sonido psicológico (Vibración si el móvil lo permite)
            if (navigator.vibrate) navigator.vibrate(50);

            // 5. Finalizar animación (1.2 segundos para no aburrir)
            setTimeout(async () => {
                
                // Mostrar Premio Visual
                elSlot.innerHTML = `<span class="${resultado.tipo} text-center flex flex-col leading-tight"><span class="text-5xl lg:text-6xl">${resultado.texto.replace(' ', '<br>')}</span></span>`;
                
                // Si hay premio, vibración de victoria
                if (resultado.premio > 0 && navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }

                // Sumar premio al estado local y actualizar UI
                currentUser.saldo += resultado.premio;
                updateUI();

                // Desbloquear botón
                isSpinning = false;
                elSpinBtn.style.opacity = '1';

                // 6. Guardar en Base de Datos en segundo plano (Asíncrono, sin bloquear al usuario)
                const { error } = await supabaseClient
                    .from('usuarios')
                    .update({ 
                        saldo: currentUser.saldo, 
                        tiradas_realizadas: currentUser.tiradas_realizadas 
                    })
                    .eq('id', currentUser.id);

                if (error) {
                    console.error("Error guardando progreso:", error);
                    // Opcional: Manejo de errores silencioso para no romper la experiencia
                }

            }, 1200); // 1.2s de pura fricción visual
        });
    </script>
</body>
</html>
