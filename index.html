<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mega Fire Roulette | Live</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --red-num: #dc2626;
            --black-num: #18181b;
            --green-num: #16a34a;
            --fire-glow: #f97316;
            --fire-core: #fef08a;
        }

        body {
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overscroll-behavior-y: contain;
            background-color: #09090b; /* Zinc 950 */
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }

        /* --- TOP JACKPOTS --- */
        .jackpot-panel {
            background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
            border-bottom: 1px solid #27272a;
        }
        .jackpot-item { text-align: center; padding: 4px 0; }
        .j-grand { text-shadow: 0 0 15px #facc15; animation: slow-pulse 2s infinite; }

        @keyframes slow-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* --- BANNER DE FASES --- */
        .phase-banner {
            background: linear-gradient(90deg, transparent, rgba(220, 38, 38, 0.2), transparent);
            border-top: 1px solid rgba(220, 38, 38, 0.5);
            border-bottom: 1px solid rgba(220, 38, 38, 0.5);
            text-shadow: 0 0 10px rgba(220, 38, 38, 0.8);
            transition: all 0.3s ease;
        }
        .phase-fire {
            background: linear-gradient(90deg, transparent, rgba(249, 115, 22, 0.3), transparent);
            border-color: #f97316;
            text-shadow: 0 0 15px #f97316;
        }

        /* --- TABLERO DE NÚMEROS (CSS GRID) --- */
        .board-container {
            display: grid;
            grid-template-columns: repeat(13, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 4px;
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
            perspective: 1000px;
        }
        
        .board-cell {
            position: relative;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 800;
            border-radius: 4px; border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.2s ease;
            aspect-ratio: 1;
        }
        .board-cell:hover { transform: scale(1.05); z-index: 10; border-color: white; }
        
        /* Colores Base */
        .cell-red { background: var(--red-num); }
        .cell-black { background: var(--black-num); }
        .cell-green { background: var(--green-num); grid-column: 1; grid-row: 1 / span 3; aspect-ratio: auto; }

        /* Estados del Tablero */
        .cell-selected {
            border: 2px solid #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.6), inset 0 0 10px rgba(0,0,0,0.5);
            transform: scale(1.05); z-index: 5;
        }
        
        .chip-visual {
            position: absolute; width: 24px; height: 24px;
            background: radial-gradient(circle, #2563eb 0%, #1e3a8a 100%);
            border: 2px dashed #93c5fd; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.5rem; font-weight: bold; color: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            animation: chip-drop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        /* --- ESTADO FIRE NUMBER --- */
        @keyframes fire-ignite {
            0% { box-shadow: 0 0 0px var(--fire-glow); }
            50% { box-shadow: 0 0 20px var(--fire-glow), inset 0 0 15px var(--fire-core); border-color: var(--fire-core); }
            100% { box-shadow: 0 0 15px var(--fire-glow); border-color: var(--fire-glow); }
        }
        .cell-fire {
            animation: fire-ignite 1s alternate infinite;
            z-index: 4;
        }
        .cell-fire::after {
            content: '🔥'; position: absolute; top: -8px; right: -8px;
            font-size: 1rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            animation: pop-in 0.3s ease;
        }

        /* --- ESTADO GANADOR / RESULTADO --- */
        .cell-winner {
            transform: scale(1.2); z-index: 20;
            border: 3px solid white;
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
            animation: winner-pulse 0.5s alternate infinite;
        }
        .board-dimmed .board-cell:not(.cell-winner):not(.cell-fire) {
            opacity: 0.3; filter: grayscale(50%);
        }

        /* --- BONUS GRID --- */
        .bonus-overlay {
            background: radial-gradient(circle at center, rgba(69, 10, 10, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%);
            backdrop-filter: blur(10px); z-index: 100;
        }
        .bonus-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            width: 100%; max-width: 320px; margin: 0 auto;
        }
        .bonus-cell {
            aspect-ratio: 1;
            background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            border: 2px solid #3f3f46; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
            transition: all 0.3s;
        }
        .bonus-cell.revealed {
            background: linear-gradient(135deg, #ea580c 0%, #9a3412 100%);
            border-color: #fde047;
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.5), inset 0 0 15px rgba(253, 224, 71, 0.3);
            animation: reveal-anim 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        @keyframes reveal-anim {
            0% { transform: scale(1); box-shadow: inset 0 0 20px rgba(0,0,0,1); }
            50% { transform: scale(1.15); box-shadow: 0 0 40px #fde047; }
            100% { transform: scale(1); }
        }
        @keyframes chip-drop { 0% { transform: scale(3) translateY(-20px); opacity: 0; } 100% { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes pop-in { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes winner-pulse { 100% { transform: scale(1.25); box-shadow: 0 0 40px rgba(255,255,255,1); } }

    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full overflow-hidden">

    <!-- PANTALLAS DE SISTEMA -->
    <div id="sys-loading" class="absolute inset-0 z-[200] bg-zinc-950 flex flex-col items-center justify-center">
        <div class="text-4xl animate-bounce mb-2">🎲</div>
        <p class="text-zinc-500 font-bold uppercase tracking-widest text-xs animate-pulse">Conectando Mesa...</p>
    </div>
    <div id="sys-error" class="absolute inset-0 z-[200] bg-zinc-950 flex flex-col items-center justify-center hidden">
        <h1 class="text-red-600 text-3xl font-black uppercase">Acceso Denegado</h1>
    </div>

    <!-- PANTALLA DE BONUS (Capa interactiva) -->
    <div id="bonus-screen" class="absolute inset-0 bonus-overlay hidden flex-col items-center justify-center px-4">
        <div class="text-center mb-6">
            <h2 class="text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-orange-500 to-red-500 uppercase drop-shadow-lg filter drop-shadow-[0_0_10px_rgba(249,115,22,0.5)]">
                Mega Fire
            </h2>
            <p class="text-orange-200 font-bold tracking-[0.2em] uppercase text-sm mt-1">Bonus Game</p>
        </div>
        
        <div class="flex justify-between w-full max-w-[320px] mb-4 px-2">
            <div class="flex flex-col items-start">
                <span class="text-[10px] text-zinc-400 uppercase font-bold">Apuesta Base</span>
                <span id="bonus-base-bet" class="text-lg font-black text-white">100</span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] text-red-400 uppercase font-bold">Spins</span>
                <span id="bonus-spins" class="text-2xl font-black text-white">3</span>
            </div>
        </div>

        <div class="bonus-grid" id="bonus-grid">
            <!-- 9 celdas generadas JS -->
        </div>

        <div id="bonus-result" class="mt-8 text-center hidden flex-col items-center" style="animation: pop-in 0.5s forwards;">
            <span class="text-xs text-yellow-500 font-bold uppercase tracking-widest">Premio Total Obtenido</span>
            <span id="bonus-total-win" class="text-6xl font-black text-green-400 drop-shadow-[0_0_15px_rgba(74,222,128,0.5)]">0</span>
            <button onclick="endRound()" class="mt-6 px-10 py-3 bg-gradient-to-b from-green-500 to-green-700 font-black text-white rounded shadow-lg uppercase text-sm border border-green-400 hover:scale-105 transition-transform">
                Continuar
            </button>
        </div>
    </div>

    <!-- MAIN APP: Header Jackpots -->
    <div class="jackpot-panel flex justify-between px-3 py-1 flex-none z-10">
        <div class="jackpot-item"><div class="text-[9px] text-green-400 font-bold uppercase tracking-wider">Mini</div><div class="text-sm font-black">x2</div></div>
        <div class="jackpot-item"><div class="text-[9px] text-blue-400 font-bold uppercase tracking-wider">Minor</div><div class="text-sm font-black">x5</div></div>
        <div class="jackpot-item"><div class="text-[9px] text-purple-400 font-bold uppercase tracking-wider">Major</div><div class="text-sm font-black">x20</div></div>
        <div class="jackpot-item"><div class="text-[9px] text-red-500 font-bold uppercase tracking-wider">Grand</div><div class="text-base font-black text-yellow-400 j-grand">x100</div></div>
    </div>

    <!-- HEADER JUGADOR -->
    <header class="px-4 py-2 bg-zinc-900/80 flex-none flex justify-between items-center border-b border-zinc-800">
        <div>
            <span class="text-[9px] text-zinc-500 uppercase font-bold tracking-widest">Jugador</span>
            <div id="player-name" class="text-xs font-bold text-zinc-200">...</div>
        </div>
        <div class="text-right">
            <span class="text-[9px] text-zinc-500 uppercase font-bold tracking-widest">Saldo</span>
            <div id="player-balance" class="text-lg font-black text-white">0</div>
        </div>
    </header>

    <!-- STATUS BANNER -->
    <div id="phase-banner" class="phase-banner flex-none py-2 text-center">
        <span id="phase-text" class="text-sm font-black uppercase tracking-[0.2em] text-white">Apuestas Abiertas</span>
    </div>

    <!-- ZONA CENTRAL: EL TABLERO -->
    <main class="flex-1 flex flex-col justify-center overflow-y-auto w-full relative">
        <div id="board-container" class="board-container w-full">
            <!-- Números inyectados por JS -->
        </div>
    </main>

    <!-- CONTROLES INFERIORES -->
    <div class="bg-zinc-950 border-t border-zinc-800 px-4 pt-3 pb-6 flex-none z-20">
        
        <div class="flex justify-between items-center mb-3">
            <span class="text-[10px] text-zinc-500 uppercase font-bold">Valor Apuesta</span>
            <span id="current-bet-display" class="text-sm font-black text-white">100</span>
        </div>

        <div class="flex justify-between gap-2 mb-4">
            <button onclick="setBetValue(100)" class="bet-btn flex-1 py-2 bg-zinc-800 border-2 border-blue-500 rounded text-white font-bold text-sm shadow-[0_0_10px_rgba(59,130,246,0.3)] transition-all">100</button>
            <button onclick="setBetValue(250)" class="bet-btn flex-1 py-2 bg-zinc-900 border-2 border-zinc-700 rounded text-zinc-400 font-bold text-sm transition-all">250</button>
            <button onclick="setBetValue(500)" class="bet-btn flex-1 py-2 bg-zinc-900 border-2 border-zinc-700 rounded text-zinc-400 font-bold text-sm transition-all">500</button>
            <button onclick="setBetValue(1000)" class="bet-btn flex-1 py-2 bg-zinc-900 border-2 border-zinc-700 rounded text-zinc-400 font-bold text-sm transition-all">1K</button>
        </div>
        
        <button id="spin-btn" class="w-full h-14 bg-zinc-800 rounded font-black text-zinc-500 uppercase tracking-widest transition-all border border-zinc-700 flex items-center justify-center gap-2" disabled>
            <span>Selecciona un número</span>
        </button>
    </div>

    <!-- SCRIPTS -->
    <script>
        // --- 1. CONFIGURACIÓN Y SUPABASE (INTOCABLE) ---
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // Variables Globales
        let currentUser = null;
        let gameState = 'BETTING_OPEN'; // BETTING_OPEN, CLOSED, REVEAL, RESULT, BONUS
        let currentBet = 100;
        let selectedNumber = null;
        let finalPrizeAmount = 0;
        
        // Estructura Ruleta
        const NUMBERS = Array.from({length: 37}, (_, i) => i);
        const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
        
        // Elementos DOM
        const elBoard = document.getElementById('board-container');
        const elBanner = document.getElementById('phase-banner');
        const elBannerText = document.getElementById('phase-text');
        const elSpinBtn = document.getElementById('spin-btn');

        // --- 2. INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', async () => {
            renderBoard();
            
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo');
            if (!codigoUrl) return document.getElementById('sys-error').classList.remove('hidden');

            const { data, error } = await supabaseClient.from('usuarios').select('*').eq('codigo', codigoUrl).single();
            if (error || !data) {
                document.getElementById('sys-loading').classList.add('hidden');
                document.getElementById('sys-error').classList.remove('hidden');
            } else {
                currentUser = data;
                document.getElementById('sys-loading').classList.add('hidden');
                updateUI();
            }
        });

        // --- 3. DIBUJAR EL TABLERO (UX/UI Nueva) ---
        function renderBoard() {
            elBoard.innerHTML = '';
            
            // Render 0 (ocupa 3 filas)
            const cell0 = document.createElement('div');
            cell0.className = 'board-cell cell-green';
            cell0.id = 'cell-0';
            cell0.innerHTML = `<span>0</span>`;
            cell0.onclick = () => handleCellClick(0);
            elBoard.appendChild(cell0);

            // Render 1-36 ordenados en 3 filas y 12 columnas
            for (let num = 1; num <= 36; num++) {
                const col = Math.ceil(num / 3) + 1; // +1 porque la col 1 es del 0
                const row = 3 - ((num - 1) % 3);
                
                const isRed = RED_NUMS.includes(num);
                const cell = document.createElement('div');
                cell.className = `board-cell ${isRed ? 'cell-red' : 'cell-black'}`;
                cell.id = `cell-${num}`;
                cell.style.gridColumn = col;
                cell.style.gridRow = row;
                cell.innerHTML = `<span>${num}</span>`;
                cell.onclick = () => handleCellClick(num);
                
                elBoard.appendChild(cell);
            }
        }

        // --- 4. INTERACCIONES FASE APUESTAS ---
        function setBetValue(amount) {
            if (gameState !== 'BETTING_OPEN') return;
            currentBet = amount;
            document.getElementById('current-bet-display').innerText = amount;
            
            document.querySelectorAll('.bet-btn').forEach(btn => {
                const val = parseInt(btn.innerText.replace('1K', '1000'));
                if (val === amount) {
                    btn.classList.replace('bg-zinc-900', 'bg-zinc-800');
                    btn.classList.replace('border-zinc-700', 'border-blue-500');
                    btn.classList.replace('text-zinc-400', 'text-white');
                    btn.style.boxShadow = '0 0 10px rgba(59,130,246,0.3)';
                } else {
                    btn.classList.replace('bg-zinc-800', 'bg-zinc-900');
                    btn.classList.replace('border-blue-500', 'border-zinc-700');
                    btn.classList.replace('text-white', 'text-zinc-400');
                    btn.style.boxShadow = 'none';
                }
            });

            // Actualizar chip visual si ya hay número seleccionado
            if (selectedNumber !== null) renderChip();
        }

        function handleCellClick(num) {
            if (gameState !== 'BETTING_OPEN') return;
            
            // Limpiar anterior
            if (selectedNumber !== null) {
                document.getElementById(`cell-${selectedNumber}`).classList.remove('cell-selected');
                const oldChip = document.getElementById('active-chip');
                if (oldChip) oldChip.remove();
            }

            selectedNumber = num;
            document.getElementById(`cell-${num}`).classList.add('cell-selected');
            renderChip();
            
            // Activar botón
            elSpinBtn.disabled = false;
            elSpinBtn.className = 'w-full h-14 bg-gradient-to-r from-red-600 to-red-800 rounded font-black text-white uppercase tracking-widest transition-all shadow-[0_4px_0_#7f1d1d] active:shadow-[0_0px_0_#7f1d1d] active:translate-y-[4px] border border-red-500 flex items-center justify-center gap-2';
            elSpinBtn.innerHTML = `<span>Apuestas Cerradas -> Girar</span>`;
        }

        function renderChip() {
            const cell = document.getElementById(`cell-${selectedNumber}`);
            const chip = document.createElement('div');
            chip.id = 'active-chip';
            chip.className = 'chip-visual';
            
            let valTxt = currentBet;
            if(currentBet >= 1000) valTxt = (currentBet/1000)+'K';
            
            chip.innerText = valTxt;
            cell.appendChild(chip);
        }

        function updateUI() {
            document.getElementById('player-name').innerText = currentUser.nombre;
            document.getElementById('player-balance').innerText = parseFloat(currentUser.saldo).toLocaleString('es-ES');
        }

        function setBanner(text, type = 'normal') {
            elBannerText.innerText = text;
            if(type === 'fire') {
                elBanner.classList.add('phase-fire');
                elBannerText.classList.add('text-orange-400');
            } else {
                elBanner.classList.remove('phase-fire');
                elBannerText.classList.remove('text-orange-400');
            }
        }

        // --- 5. LÓGICA MATEMÁTICA INTACTA (INTOCABLE) ---
        function getResultadoTirada(tiradas) {
            const rand = Math.random();
            let mult = 0; let tipo = '';
            if (tiradas <= 50) {
                if (rand < 0.20) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.50) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.90) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            } else {
                if (rand < 0.50) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.90) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.98) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            }
            return { mult, tipo };
        }

        // --- 6. EL MOTOR DE LA EXPERIENCIA VISUAL ---
        elSpinBtn.addEventListener('click', async () => {
            if (gameState !== 'BETTING_OPEN' || selectedNumber === null) return;
            if (currentUser.saldo < currentBet) return alert('Saldo insuficiente.');

            // Bloquear Estado
            gameState = 'CLOSED';
            elSpinBtn.disabled = true;
            elSpinBtn.classList.replace('from-red-600', 'from-zinc-700');
            elSpinBtn.classList.replace('to-red-800', 'to-zinc-900');
            elSpinBtn.innerHTML = `<span>Girando...</span>`;
            
            setBanner('Apuestas Cerradas');

            // Actualizar Saldo Inmediato (Intacto)
            currentUser.saldo -= currentBet;
            currentUser.tiradas_realizadas += 1;
            updateUI();

            // Ejecutar Lógica Intacta
            const { mult, tipo } = getResultadoTirada(currentUser.tiradas_realizadas);
            
            // Traducir matemática a la UX del Tablero
            let fireNumbers = [];
            let resultNumber = null;

            // Si hay premio, el número que eligió el usuario TIENE que ser Fire y TIENE que ser el resultado.
            if (mult > 0) {
                resultNumber = selectedNumber;
                fireNumbers.push(selectedNumber);
                // Rellenar con otros 4 fires aleatorios
                while(fireNumbers.length < 5) {
                    let r = Math.floor(Math.random() * 37);
                    if(!fireNumbers.includes(r)) fireNumbers.push(r);
                }
            } 
            // Si NO hay premio, el número elegido NO puede ser el resultado. Puede ser Fire o no.
            else {
                // Generar 5 fires aleatorios
                while(fireNumbers.length < 5) {
                    let r = Math.floor(Math.random() * 37);
                    if(!fireNumbers.includes(r)) fireNumbers.push(r);
                }
                // Elegir resultado aleatorio que NO sea el del usuario.
                do {
                    resultNumber = Math.floor(Math.random() * 37);
                } while (resultNumber === selectedNumber);
            }

            // --- ANIMACIÓN: FASE REVEAL FIRE NUMBERS ---
            await new Promise(r => setTimeout(r, 1000));
            setBanner('Revelando Fire Numbers', 'fire');
            
            for (let i = 0; i < fireNumbers.length; i++) {
                const cell = document.getElementById(`cell-${fireNumbers[i]}`);
                cell.classList.add('cell-fire');
                if (navigator.vibrate) navigator.vibrate(20);
                await new Promise(r => setTimeout(r, 400));
            }

            // --- ANIMACIÓN: SPIN / BUSCANDO RESULTADO ---
            setBanner('Buscando Número...');
            let currentJump = 0;
            let speed = 50;
            let lastCell = null;

            // Simulación de la bola saltando por el tablero
            const jumpInterval = setInterval(() => {
                if(lastCell) lastCell.style.opacity = '1';
                
                const randomNum = Math.floor(Math.random() * 37);
                const cell = document.getElementById(`cell-${randomNum}`);
                cell.style.opacity = '0.5';
                lastCell = cell;

                currentJump++;
                if (currentJump > 30) {
                    clearInterval(jumpInterval);
                    if(lastCell) lastCell.style.opacity = '1';
                    showResultPhase(resultNumber, mult, tipo, fireNumbers);
                }
            }, speed);
        });

        // --- 7. FASE RESULTADO Y BONUS ---
        async function showResultPhase(resultNumber, mult, tipo, fireNumbers) {
            gameState = 'RESULT';
            
            // Atenuar todo menos el resultado
            elBoard.classList.add('board-dimmed');
            const winnerCell = document.getElementById(`cell-${resultNumber}`);
            winnerCell.classList.add('cell-winner');
            
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);

            if (mult > 0) {
                // FUEGO! TRANSICIÓN A BONUS
                setBanner(`¡FIRE NUMBER ${resultNumber}!`, 'fire');
                await new Promise(r => setTimeout(r, 2000));
                startBonusRound(mult, tipo);
            } else {
                // PÉRDIDA NORMAL
                setBanner(`Resultado: ${resultNumber}`);
                if (fireNumbers.includes(resultNumber)) {
                    // Cae en fuego, pero no era nuestro número (Opcional visual)
                }
                await new Promise(r => setTimeout(r, 2000));
                endRound();
            }
        }

        // --- 8. LA RONDA DE BONUS (VISUAL) ---
        function startBonusRound(mult, tipo) {
            gameState = 'BONUS';
            finalPrizeAmount = currentBet * mult; // Matemática intacta
            
            document.getElementById('bonus-base-bet').innerText = currentBet;
            document.getElementById('bonus-total-win').innerText = "0";
            document.getElementById('bonus-result').classList.add('hidden');
            
            const grid = document.getElementById('bonus-grid');
            grid.innerHTML = '';
            for(let i=0; i<9; i++) grid.innerHTML += `<div class="bonus-cell" id="bcell-${i}"></div>`;
            
            document.getElementById('bonus-spins').innerText = '3';
            document.getElementById('bonus-screen').classList.remove('hidden');
            document.getElementById('bonus-screen').classList.add('flex');

            // Drops visuales en base al premio matemático
            let drops = [];
            if (tipo === 'false-win') drops = [ {val: `x0.3`, class: 'text-white text-3xl'} ];
            else if (tipo === 'win-normal') drops = [ {val: 'x1', class: 'text-white text-3xl'}, {val: 'x0.2', class: 'text-white text-2xl'} ];
            else if (tipo === 'win-mega') drops = [ {val: 'x2', class: 'text-white text-3xl'}, {val: 'x1', class: 'text-white text-2xl'}, {val: 'MINI', class: 'text-green-400 text-3xl drop-shadow-[0_0_10px_#4ade80]'} ];

            let spinCount = 3;
            let dropIndex = 0;
            const availableCells = [0,1,2,3,4,5,6,7,8].sort(() => 0.5 - Math.random());

            const interval = setInterval(() => {
                spinCount--;
                document.getElementById('bonus-spins').innerText = spinCount;
                if (navigator.vibrate) navigator.vibrate(30);

                if (dropIndex < drops.length && spinCount > 0) {
                    const cell = document.getElementById(`bcell-${availableCells[dropIndex]}`);
                    cell.classList.add('revealed');
                    cell.innerHTML = `<span class="font-black ${drops[dropIndex].class}">${drops[dropIndex].val}</span>`;
                    
                    dropIndex++;
                    spinCount = 3; // Respin ilusión
                    document.getElementById('bonus-spins').innerText = spinCount;
                    if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
                }

                if (spinCount <= 0 || dropIndex >= drops.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('bonus-total-win').innerText = finalPrizeAmount.toLocaleString();
                        document.getElementById('bonus-total-result').innerText = `¡GANAS ${finalPrizeAmount}!`;
                        document.getElementById('bonus-result').classList.remove('hidden');
                        document.getElementById('bonus-result').classList.add('flex');
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                    }, 1000);
                }
            }, 1000);
        }

        // --- 9. FINALIZAR RONDA Y GUARDAR (INTOCABLE) ---
        async function endRound() {
            // Sumar premio
            currentUser.saldo += finalPrizeAmount;
            finalPrizeAmount = 0;
            updateUI();

            // Guardar en Supabase (Lógica intacta)
            await supabaseClient.from('usuarios').update({ 
                saldo: currentUser.saldo, 
                tiradas_realizadas: currentUser.tiradas_realizadas 
            }).eq('id', currentUser.id);

            // Reset UI
            document.getElementById('bonus-screen').classList.add('hidden');
            document.getElementById('bonus-screen').classList.remove('flex');
            
            elBoard.classList.remove('board-dimmed');
            document.querySelectorAll('.board-cell').forEach(c => {
                c.classList.remove('cell-fire', 'cell-winner', 'cell-selected');
                c.style.opacity = '1';
                c.style.filter = 'none';
            });
            const oldChip = document.getElementById('active-chip');
            if(oldChip) oldChip.remove();
            selectedNumber = null;

            setBanner('Apuestas Abiertas');
            gameState = 'BETTING_OPEN';
            
            elSpinBtn.disabled = true;
            elSpinBtn.className = 'w-full h-14 bg-zinc-800 rounded font-black text-zinc-500 uppercase tracking-widest transition-all border border-zinc-700 flex items-center justify-center gap-2';
            elSpinBtn.innerHTML = `<span>Selecciona un número</span>`;
        }
    </script>
</body>
</html>
