<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mega Fire Roulette | Live</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- LIBRERÍAS AÑADIDAS PARA ANIMACIÓN E INTERACCIÓN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- GSAP: El estándar de la industria para animaciones físicas y easings realistas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --red-num: #dc2626; --black-num: #18181b; --green-num: #16a34a;
            --fire-glow: #f97316; --fire-core: #fef08a;
            --safe-bottom: env(safe-area-inset-bottom, 12px);
        }

        body {
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overscroll-behavior-y: contain; background-color: #050505; color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
            overflow: hidden; /* Prohíbe el scroll general. Todo encaja en 100dvh */
        }

        /* --- CABECERA Y JACKPOTS (Compacto Mobile) --- */
        .jackpot-row { background: linear-gradient(180deg, #18181b 0%, #09090b 100%); border-bottom: 1px solid #27272a; }
        .j-grand { text-shadow: 0 0 10px #facc15; animation: slow-pulse 2s infinite; }
        @keyframes slow-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* --- RULETA FÍSICA Y DINÁMICA --- */
        #roulette-zone { transition: height 0.4s ease, opacity 0.4s ease; }
        .wheel-svg-container {
            width: 100%; height: 100%; border-radius: 50%;
            border: 4px solid #27272a; box-shadow: 0 0 30px rgba(0,0,0,0.9);
            background: #111;
        }
        .wheel-pointer {
            position: absolute; top: -5px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent;
            border-top: 25px solid #facc15; z-index: 30; filter: drop-shadow(0 4px 5px rgba(0,0,0,1));
        }

        /* --- TABLERO MOBILE FIRST (COMPACTO) --- */
        #board-zone { touch-action: none; /* Crucial: Permite pintar sin scrollear la página */ }
        
        .board-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(13, 1fr);
            gap: 2px; width: 100%; height: 100%; max-width: 450px; margin: 0 auto;
        }
        
        .board-cell {
            position: relative; display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; font-weight: 800; border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.15); box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            transition: background 0.1s;
        }
        
        .cell-red { background: var(--red-num); }
        .cell-black { background: var(--black-num); }
        .cell-green { background: var(--green-num); grid-column: 1 / span 3; grid-row: 1; }
        .cell-num { grid-row: span 1; }

        /* ESTADOS DE LAS CELDAS */
        .cell-selected { border: 2px solid #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.8), inset 0 0 10px rgba(0,0,0,0.5); z-index: 5; }
        .cell-fire { animation: fire-ignite 0.8s alternate infinite; z-index: 6; }
        .cell-fire::before {
            content: '🔥'; position: absolute; top: -10px; left: -10px; font-size: 1.2rem;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.9)); z-index: 10;
        }
        .cell-winner { border: 3px solid white !important; transform: scale(1.1); z-index: 20; box-shadow: 0 0 25px rgba(255,255,255,1) !important; }
        .board-dimmed .board-cell:not(.cell-winner):not(.cell-fire) { opacity: 0.3; filter: grayscale(80%); }

        @keyframes fire-ignite {
            0% { box-shadow: 0 0 5px var(--fire-glow); border-color: var(--fire-glow); }
            100% { box-shadow: 0 0 15px var(--fire-glow), inset 0 0 15px var(--fire-core); border-color: var(--fire-core); }
        }

        /* FICHAS APUESTAS */
        .chip-visual {
            position: absolute; width: 24px; height: 24px;
            background: radial-gradient(circle, #2563eb 0%, #1e3a8a 100%);
            border: 2px solid #93c5fd; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.55rem; font-weight: 900; color: white;
            box-shadow: 0 3px 5px rgba(0,0,0,0.8); pointer-events: none; z-index: 10;
        }

        /* --- MEGA FIRE BONUS GRID --- */
        #bonus-zone {
            position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(69, 10, 10, 0.98) 0%, rgba(0, 0, 0, 0.98) 100%);
            z-index: 100; display: none; flex-direction: column; justify-content: center; padding: 1rem;
        }
        .bonus-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 350px; margin: 0 auto; }
        .bonus-cell {
            aspect-ratio: 1; background: linear-gradient(135deg, #18181b 0%, #09090b 100%);
            border: 2px solid #3f3f46; border-radius: 8px; display: flex; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,1); transition: transform 0.3s;
        }
        .bonus-cell.revealed {
            background: linear-gradient(135deg, #ea580c 0%, #9a3412 100%); border-color: #fde047;
            box-shadow: 0 0 20px rgba(234, 88, 12, 0.5), inset 0 0 10px rgba(253, 224, 71, 0.3);
            animation: cell-reveal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes cell-reveal { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        /* UTILIDADES INFERIORES FIJAS */
        .bottom-controls { padding-bottom: var(--safe-bottom); }
        .btn-active-chip { border-color: #3b82f6 !important; background-color: #1e3a8a !important; color: white !important; }
        .btn-eraser-active { border-color: #ef4444 !important; background-color: #7f1d1d !important; color: white !important; }
    </style>
</head>
<body class="flex flex-col h-[100dvh] w-full bg-black">

    <!-- PANTALLAS DE CARGA -->
    <div id="sys-loading" class="absolute inset-0 z-[200] bg-black flex flex-col items-center justify-center">
        <div class="text-5xl mb-4">🔥</div>
        <p class="text-orange-500 font-bold uppercase tracking-widest text-sm animate-pulse">Conectando Mesa...</p>
    </div>
    
    <!-- 1. CABECERA: JACKPOTS Y JUGADOR (Compacto) -->
    <div class="jackpot-row flex justify-between px-2 py-1 flex-none z-10 w-full">
        <div class="text-center w-1/4"><div class="text-[8px] text-green-400 font-bold uppercase">Mini</div><div class="text-xs font-black">x2</div></div>
        <div class="text-center w-1/4 border-l border-zinc-800"><div class="text-[8px] text-blue-400 font-bold uppercase">Minor</div><div class="text-xs font-black">x5</div></div>
        <div class="text-center w-1/4 border-l border-zinc-800"><div class="text-[8px] text-purple-400 font-bold uppercase">Major</div><div class="text-xs font-black">x20</div></div>
        <div class="text-center w-1/4 border-l border-zinc-800"><div class="text-[8px] text-red-500 font-bold uppercase">Grand</div><div class="text-xs font-black text-yellow-400 j-grand">x100</div></div>
    </div>
    <header class="px-3 py-1.5 bg-zinc-900 flex-none flex justify-between items-center border-b border-zinc-800 w-full">
        <div class="flex flex-col">
            <span class="text-[9px] text-zinc-500 uppercase font-bold">Jugador</span>
            <span id="player-name" class="text-xs font-bold text-zinc-200">...</span>
        </div>
        <div class="flex flex-col items-end">
            <span class="text-[9px] text-zinc-500 uppercase font-bold">Saldo</span>
            <span id="player-balance" class="text-base font-black text-white">0 <span class="text-[10px] text-zinc-400">bits</span></span>
        </div>
    </header>

    <!-- 2. ZONA DE LA RULETA (Dinámica) -->
    <div id="roulette-zone" class="flex-none flex flex-col items-center justify-center bg-zinc-950 w-full h-[80px] border-b border-zinc-800 relative">
        <div id="phase-text" class="absolute top-2 text-[10px] font-black uppercase tracking-[0.2em] text-blue-400 z-40 bg-zinc-900/80 px-3 py-1 rounded-full">
            APUESTAS ABIERTAS 00:15
        </div>
        <!-- Rueda SVG (Pequeña en apuestas, grande en giro) -->
        <div id="wheel-wrapper" class="relative w-[120px] h-[120px] mt-4 transition-all duration-500" style="opacity: 0.5;">
            <div class="wheel-pointer"></div>
            <div id="wheel-svg-container" class="wheel-svg-container"></div>
        </div>
    </div>

    <!-- 3. ZONA DEL TABLERO (Full Screen Mobile) -->
    <div id="board-zone" class="flex-1 w-full p-2 bg-[#09090b] min-h-0">
        <div id="board-container" class="board-grid">
            <!-- Inyectado por JS para mantener el HTML limpio y estructurado -->
        </div>
    </div>

    <!-- 4. CONTROLES INFERIORES FIJOS -->
    <div id="controls-zone" class="bg-zinc-950 border-t border-zinc-800 px-2 pt-2 flex-none bottom-controls z-20 w-full shadow-[0_-10px_20px_rgba(0,0,0,0.8)]">
        
        <!-- Fichas y Goma de Borrar -->
        <div class="flex justify-between gap-1 mb-2">
            <button onclick="setMode('bet', 100)" class="chip-btn btn-active-chip bg-zinc-800 border border-zinc-700 rounded py-1.5 flex-1 text-zinc-300 font-bold text-xs">100</button>
            <button onclick="setMode('bet', 250)" class="chip-btn bg-zinc-800 border border-zinc-700 rounded py-1.5 flex-1 text-zinc-300 font-bold text-xs">250</button>
            <button onclick="setMode('bet', 500)" class="chip-btn bg-zinc-800 border border-zinc-700 rounded py-1.5 flex-1 text-zinc-300 font-bold text-xs">500</button>
            <button onclick="setMode('bet', 1000)" class="chip-btn bg-zinc-800 border border-zinc-700 rounded py-1.5 flex-1 text-zinc-300 font-bold text-xs">1K</button>
            <button onclick="setMode('erase')" class="chip-btn bg-zinc-900 border border-zinc-700 rounded py-1.5 flex-none w-12 text-zinc-400 font-bold text-xs">🗑️</button>
        </div>

        <!-- Acciones -->
        <div class="flex justify-between items-center mb-2 px-1">
            <div class="flex gap-2">
                <button onclick="undoBet()" class="bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded text-[10px] font-bold uppercase active:scale-95">Deshacer</button>
                <button onclick="clearBets()" class="bg-zinc-800 text-zinc-300 px-3 py-1.5 rounded text-[10px] font-bold uppercase active:scale-95">Limpiar</button>
            </div>
            <div class="text-right">
                <span class="text-[9px] text-zinc-500 uppercase font-bold block leading-none">Total</span>
                <span id="total-bet-display" class="text-lg font-black text-white leading-none">0 <span class="text-[9px] text-zinc-400">bits</span></span>
            </div>
        </div>
        
        <!-- BOTÓN GIRAR (Gigante y seguro) -->
        <button id="btn-spin" onclick="executeRound()" class="w-full h-14 bg-zinc-800 rounded font-black text-zinc-500 uppercase tracking-widest border border-zinc-700 flex items-center justify-center transition-all" disabled>
            SELECCIONA APUESTA
        </button>
    </div>

    <!-- 5. PANTALLA MEGA FIRE BONUS (Oculta por defecto) -->
    <div id="bonus-zone">
        <div class="text-center mb-6">
            <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500 uppercase drop-shadow-[0_0_15px_rgba(239,68,68,0.8)]">
                MEGA FIRE BONUS
            </h2>
        </div>
        
        <div class="flex justify-between w-full max-w-[350px] mb-4 mx-auto bg-black/60 p-3 rounded border border-red-900/50">
            <div class="flex flex-col items-start">
                <span class="text-[10px] text-zinc-400 uppercase font-bold">Apuesta Base</span>
                <span id="bonus-base-bet" class="text-lg font-black text-white">0 <span class="text-[10px]">bits</span></span>
            </div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] text-red-400 uppercase font-bold">Spins</span>
                <span id="bonus-spins-counter" class="text-2xl font-black text-white">3</span>
            </div>
        </div>

        <div class="bonus-grid" id="bonus-grid">
            <!-- Generado por JS -->
        </div>

        <div class="text-center mt-6">
            <span class="text-[10px] text-yellow-500 uppercase font-bold tracking-widest block mb-1">Premio Actual</span>
            <span id="bonus-current-win" class="text-3xl font-black text-green-400">0 bits</span>
        </div>

        <div id="bonus-result-panel" class="absolute inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-6">
            <span class="text-sm text-yellow-500 font-bold uppercase tracking-[0.2em] mb-4">Bonus Completado</span>
            <span class="text-xs text-zinc-400 font-bold uppercase mb-2">Premio Total</span>
            <span id="bonus-total-win" class="text-5xl font-black text-green-400 drop-shadow-[0_0_20px_#4ade80] mb-8">0 <span class="text-xl">bits</span></span>
            <button onclick="resetRound()" class="w-full max-w-[250px] h-14 bg-green-700 text-white font-black rounded uppercase tracking-widest active:scale-95">
                Volver a Ruleta
            </button>
        </div>
    </div>

    <!-- LÓGICA PRINCIPAL (Vanilla JS) -->
    <script>
        /* --- SUPABASE (INTOCABLE) --- */
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        
        /* --- ESTADOS Y CONSTANTES --- */
        let gameState = 'BETTING'; // BETTING, CLOSED, SPINNING, RESULT, BONUS
        let inputMode = 'bet'; // 'bet' o 'erase'
        let currentChip = 100;
        let activeBets = {}; // { 7: 100, 8: 250 }
        let betHistory = []; // Para el botón deshacer
        let finalPrizeAmount = 0;

        const ROULETTE_NUMS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        const RED_NUMS = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

        /* --- INICIALIZACIÓN --- */
        document.addEventListener('DOMContentLoaded', async () => {
            buildBoard();
            buildSvgWheel();
            setupPointerEvents();
            
            const urlParams = new URLSearchParams(window.location.search);
            const codigo = urlParams.get('codigo');
            if (!codigo) return document.getElementById('sys-error').classList.remove('hidden');

            const { data, error } = await supabaseClient.from('usuarios').select('*').eq('codigo', codigo).single();
            if (error || !data) {
                document.getElementById('sys-loading').classList.add('hidden');
                document.getElementById('sys-error').classList.remove('hidden');
            } else {
                currentUser = data;
                document.getElementById('sys-loading').classList.add('hidden');
                updateBalanceUI();
            }
        });

        function updateBalanceUI() {
            document.getElementById('player-name').innerText = currentUser.nombre;
            document.getElementById('player-balance').innerHTML = `${parseFloat(currentUser.saldo).toLocaleString('es-ES')} <span class="text-[10px] text-zinc-400">bits</span>`;
        }

        /* --- CONSTRUCCIÓN DEL TABLERO MOBILE-FIRST --- */
        function buildBoard() {
            const container = document.getElementById('board-container');
            container.innerHTML = `<div class="board-cell cell-green" data-num="0" id="cell-0">0</div>`;
            
            for(let row=0; row<12; row++) {
                for(let col=1; col<=3; col++) {
                    const num = (row * 3) + col;
                    const isRed = RED_NUMS.includes(num);
                    container.innerHTML += `<div class="board-cell cell-num ${isRed ? 'cell-red' : 'cell-black'}" data-num="${num}" id="cell-${num}">${num}</div>`;
                }
            }
        }

        /* --- EVENTOS TÁCTILES: PINTAR (DRAG & BET) SIN BUGS --- */
        let isPainting = false;
        let paintedInStroke = new Set(); // Evita sumar 500 veces al mismo número si dejas el dedo quieto

        function setupPointerEvents() {
            const board = document.getElementById('board-zone');
            
            board.addEventListener('pointerdown', (e) => {
                if (gameState !== 'BETTING') return;
                isPainting = true;
                paintedInStroke.clear();
                processPointer(e);
            });

            board.addEventListener('pointermove', (e) => {
                if (!isPainting || gameState !== 'BETTING') return;
                processPointer(e);
            });

            window.addEventListener('pointerup', () => { isPainting = false; });
            window.addEventListener('pointercancel', () => { isPainting = false; });
        }

        function processPointer(e) {
            const el = document.elementFromPoint(e.clientX, e.clientY);
            if (!el) return;
            const cell = el.closest('.board-cell');
            
            if (cell) {
                const num = parseInt(cell.getAttribute('data-num'));
                if (!paintedInStroke.has(num)) {
                    paintedInStroke.add(num);
                    
                    if (inputMode === 'bet') {
                        activeBets[num] = (activeBets[num] || 0) + currentChip;
                        betHistory.push({ type: 'add', num, amount: currentChip });
                        if(navigator.vibrate) navigator.vibrate(10);
                    } else if (inputMode === 'erase' && activeBets[num]) {
                        betHistory.push({ type: 'erase', num, amount: activeBets[num] });
                        delete activeBets[num];
                        if(navigator.vibrate) navigator.vibrate(15);
                    }
                    updateBoardUI();
                }
            }
        }

        /* --- GESTIÓN DE CONTROLES DE APUESTA --- */
        function setMode(mode, val = null) {
            if(gameState !== 'BETTING') return;
            inputMode = mode;
            if(val) currentChip = val;
            
            document.querySelectorAll('.chip-btn').forEach(btn => {
                btn.classList.remove('btn-active-chip', 'btn-eraser-active');
                if (mode === 'bet' && parseInt(btn.innerText.replace('1K','1000')) === val) btn.classList.add('btn-active-chip');
                if (mode === 'erase' && btn.innerText === '🗑️') btn.classList.add('btn-eraser-active');
            });
        }

        function undoBet() {
            if(gameState !== 'BETTING' || betHistory.length === 0) return;
            const action = betHistory.pop();
            
            if (action.type === 'add') {
                activeBets[action.num] -= action.amount;
                if (activeBets[action.num] <= 0) delete activeBets[action.num];
            } else if (action.type === 'erase') {
                activeBets[action.num] = action.amount; // Restaurar la apuesta borrada
            }
            updateBoardUI();
        }

        function clearBets() {
            if(gameState !== 'BETTING') return;
            activeBets = {}; betHistory = [];
            updateBoardUI();
        }

        function updateBoardUI() {
            // Limpiar visuales
            document.querySelectorAll('.board-cell').forEach(c => {
                c.classList.remove('cell-selected');
                const chip = c.querySelector('.chip-visual');
                if (chip) chip.remove();
            });
            
            let total = 0;
            for (const [num, amount] of Object.entries(activeBets)) {
                total += amount;
                const cell = document.getElementById(`cell-${num}`);
                if (cell) {
                    cell.classList.add('cell-selected');
                    let txt = amount >= 1000 ? (amount/1000)+'K' : amount;
                    cell.innerHTML += `<div class="chip-visual">${txt}</div>`;
                }
            }

            document.getElementById('total-bet-display').innerHTML = `${total.toLocaleString()} <span class="text-[9px] text-zinc-400">bits</span>`;
            
            const btn = document.getElementById('btn-spin');
            if (total > 0) {
                btn.disabled = false;
                btn.className = 'w-full h-14 bg-gradient-to-r from-green-600 to-green-700 rounded font-black text-white uppercase tracking-widest border border-green-500 shadow-[0_4px_0_#166534] active:shadow-[0_0_0_#166534] active:translate-y-[4px] flex items-center justify-center transition-all';
                btn.innerText = 'CERRAR Y GIRAR';
            } else {
                btn.disabled = true;
                btn.className = 'w-full h-14 bg-zinc-800 rounded font-black text-zinc-500 uppercase tracking-widest border border-zinc-700 flex items-center justify-center transition-all';
                btn.innerText = 'SELECCIONA APUESTA';
            }
        }

        /* --- LÓGICA MATEMÁTICA INTACTA --- */
        function getResultadoTirada(tiradas) {
            const rand = Math.random();
            let mult = 0; let tipo = '';
            if (tiradas <= 50) {
                if (rand < 0.20) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.50) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.90) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            } else {
                if (rand < 0.50) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.90) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.98) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            }
            return { mult, tipo };
        }

        /* --- CONSTRUCCIÓN RULETA SVG --- */
        function buildSvgWheel() {
            const container = document.getElementById('wheel-svg-container');
            let svg = `<svg viewBox="0 0 100 100" width="100%" height="100%">`;
            const angle = 360 / 37;
            const rad = Math.PI / 180;
            
            ROULETTE_NUMS.forEach((num, i) => {
                let startAngle = (i * angle) - (angle/2);
                let endAngle = ((i + 1) * angle) - (angle/2);
                let x1 = 50 + 50 * Math.sin(startAngle * rad);
                let y1 = 50 - 50 * Math.cos(startAngle * rad);
                let x2 = 50 + 50 * Math.sin(endAngle * rad);
                let y2 = 50 - 50 * Math.cos(endAngle * rad);
                
                let color = (num === 0) ? '#16a34a' : (i % 2 === 0 ? '#171717' : '#dc2626');
                svg += `<path d="M50,50 L${x1},${y1} A50,50 0 0,1 ${x2},${y2} Z" fill="${color}" stroke="#000" stroke-width="0.3"/>`;
                
                let textAngle = i * angle;
                svg += `<text x="50" y="8" fill="#fff" font-size="4" font-weight="bold" font-family="sans-serif" text-anchor="middle" transform="rotate(${textAngle}, 50, 50)">${num}</text>`;
            });
            svg += `</svg>`;
            container.innerHTML = svg;
        }

        /* --- FASE: EJECUTAR RONDA --- */
        async function executeRound() {
            const totalBet = Object.values(activeBets).reduce((a, b) => a + b, 0);
            if (totalBet <= 0 || gameState !== 'BETTING') return;
            if (currentUser.saldo < totalBet) return alert('Saldo insuficiente.');

            // 1. CERRAR APUESTAS
            gameState = 'CLOSED';
            const phaseText = document.getElementById('phase-text');
            phaseText.innerText = 'APUESTAS CERRADAS';
            phaseText.className = 'absolute top-2 text-[10px] font-black uppercase tracking-[0.2em] text-red-500 z-40 bg-zinc-900/80 px-3 py-1 rounded-full';
            
            document.getElementById('btn-spin').disabled = true;
            document.getElementById('board-zone').classList.add('board-dimmed');

            // 2. LÓGICA BACKEND (Cobro Inmediato)
            currentUser.saldo -= totalBet;
            currentUser.tiradas_realizadas += 1;
            updateBalanceUI();

            const { mult, tipo } = getResultadoTirada(currentUser.tiradas_realizadas);
            
            // 3. DETERMINAR RESULTADO EXACTO (CUMPLIENDO LA LÓGICA)
            let resultNumber = null;
            const userNumbers = Object.keys(activeBets).map(Number);
            
            if (mult > 0) {
                // Ganador. El resultado debe ser de la lista del usuario.
                resultNumber = userNumbers[Math.floor(Math.random() * userNumbers.length)];
            } else {
                // Perdedor. El resultado no debe ser del usuario.
                const availableLosses = ROULETTE_NUMS.filter(n => !userNumbers.includes(n));
                resultNumber = availableLosses[Math.floor(Math.random() * availableLosses.length)];
            }

            // Fire Numbers
            let fireNumbers = [resultNumber]; // Aseguramos que el resultado sea fuego si toca.
            while(fireNumbers.length < 5) {
                let r = Math.floor(Math.random() * 37);
                if(!fireNumbers.includes(r)) fireNumbers.push(r);
            }

            // 4. REVELAR FIRE NUMBERS
            phaseText.innerText = '🔥 FIRE NUMBERS 🔥';
            phaseText.classList.replace('text-red-500', 'text-orange-500');
            await new Promise(r => setTimeout(r, 400));
            
            for (let num of fireNumbers) {
                document.getElementById(`cell-${num}`).classList.add('cell-fire');
                if (navigator.vibrate) navigator.vibrate(20);
                await new Promise(r => setTimeout(r, 200));
            }

            // 5. INICIAR GIRO (ANIMACIÓN GSAP)
            phaseText.innerText = 'GIRANDO...';
            phaseText.classList.add('animate-pulse');
            
            // Expandir ruleta visualmente
            const rZone = document.getElementById('roulette-zone');
            rZone.style.height = '280px';
            document.getElementById('wheel-wrapper').style.width = '240px';
            document.getElementById('wheel-wrapper').style.height = '240px';
            document.getElementById('wheel-wrapper').style.opacity = '1';

            // Usando GSAP para rotación hiperrealista
            const targetIndex = ROULETTE_NUMS.indexOf(resultNumber);
            const targetAngle = 360 - (targetIndex * SEGMENT_DEG); 
            const totalRotation = (360 * 10) + targetAngle; // 10 vueltas completas

            gsap.to("#wheel-svg-container", {
                rotation: totalRotation,
                duration: 6,
                ease: "power2.inOut",
                onComplete: () => showResult(resultNumber, mult, tipo, totalBet)
            });
        }

        /* --- FASE: RESULTADO --- */
        async function showResult(resultNumber, mult, tipo, totalBet) {
            gameState = 'RESULT';
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
            
            const phaseText = document.getElementById('phase-text');
            document.getElementById(`cell-${resultNumber}`).classList.add('cell-winner');

            if (mult > 0) {
                phaseText.innerText = `🔥 RESULTADO: ${resultNumber} 🔥`;
                phaseText.className = 'absolute top-2 text-[14px] font-black uppercase tracking-[0.2em] text-red-500 z-40 bg-zinc-900/90 px-4 py-2 rounded-full drop-shadow-[0_0_10px_#ef4444]';
                await new Promise(r => setTimeout(r, 2000));
                
                // Entrar al Bonus
                startBonusGame(totalBet, mult, tipo);
            } else {
                phaseText.innerText = `RESULTADO: ${resultNumber}`;
                phaseText.className = 'absolute top-2 text-[12px] font-black uppercase tracking-[0.2em] text-zinc-300 z-40 bg-zinc-900/90 px-4 py-2 rounded-full';
                await new Promise(r => setTimeout(r, 2500));
                
                finalPrizeAmount = 0;
                resetRound();
            }
        }

        /* --- FASE: MEGA FIRE BONUS --- */
        function startBonusGame(totalBet, mult, tipo) {
            gameState = 'BONUS';
            finalPrizeAmount = totalBet * mult; // La matemática dicta el resultado final
            
            document.getElementById('bonus-zone').style.display = 'flex';
            document.getElementById('bonus-base-bet').innerHTML = `${totalBet.toLocaleString()} <span class="text-[10px]">bits</span>`;
            document.getElementById('bonus-current-win').innerText = `0 bits`;
            
            const grid = document.getElementById('bonus-grid');
            grid.innerHTML = '';
            for(let i=0; i<9; i++) grid.innerHTML += `<div class="bonus-cell" id="bcell-${i}"></div>`;

            // Configurar los multiplicadores visuales (Contextualizados a la ganancia real)
            let drops = [];
            if (tipo === 'false-win') drops = [ {val: `x0.3`, style: 'text-white text-3xl'} ];
            else if (tipo === 'win-normal') drops = [ {val: 'x0.7', style: 'text-white text-2xl'}, {val: 'x0.5', style: 'text-white text-2xl'} ];
            else if (tipo === 'win-mega') drops = [ {val: 'x2', style: 'text-white text-3xl'}, {val: 'x1', style: 'text-white text-xl'}, {val: 'MINI', style: 'text-green-400 text-3xl drop-shadow-[0_0_10px_#4ade80]'} ];

            let spinCount = 3;
            let dropIndex = 0;
            const availableCells = [0,1,2,3,4,5,6,7,8].sort(() => 0.5 - Math.random());
            let accumulatedWin = 0;

            const interval = setInterval(() => {
                spinCount--;
                document.getElementById('bonus-spins-counter').innerText = spinCount;
                if (navigator.vibrate) navigator.vibrate(30);

                if (dropIndex < drops.length && spinCount > 0) {
                    const cell = document.getElementById(`bcell-${availableCells[dropIndex]}`);
                    cell.classList.add('revealed');
                    cell.innerHTML = `<span class="font-black ${drops[dropIndex].style}">${drops[dropIndex].val}</span>`;
                    
                    accumulatedWin = (dropIndex + 1 === drops.length) ? finalPrizeAmount : Math.floor(finalPrizeAmount / 2);
                    document.getElementById('bonus-current-win').innerText = `${accumulatedWin.toLocaleString()} bits`;

                    dropIndex++;
                    spinCount = 3; // Respin Ilusión
                    document.getElementById('bonus-spins-counter').innerText = spinCount;
                    if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
                }

                if (spinCount <= 0 || dropIndex >= drops.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('bonus-total-win').innerHTML = `${finalPrizeAmount.toLocaleString()} <span class="text-xl">bits</span>`;
                        document.getElementById('bonus-result-panel').classList.remove('hidden');
                        document.getElementById('bonus-result-panel').classList.add('flex');
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                    }, 1200);
                }
            }, 1000);
        }

        /* --- RESET Y GUARDADO FINAL --- */
        async function resetRound() {
            // Guardar Lógica
            currentUser.saldo += finalPrizeAmount;
            finalPrizeAmount = 0;
            updateBalanceUI();

            await supabaseClient.from('usuarios').update({ 
                saldo: currentUser.saldo, tiradas_realizadas: currentUser.tiradas_realizadas 
            }).eq('id', currentUser.id);

            // Reset UI
            document.getElementById('bonus-zone').style.display = 'none';
            document.getElementById('bonus-result-panel').classList.add('hidden');
            document.getElementById('bonus-result-panel').classList.remove('flex');
            
            // Retraer ruleta
            const rZone = document.getElementById('roulette-zone');
            rZone.style.height = '80px';
            document.getElementById('wheel-wrapper').style.width = '120px';
            document.getElementById('wheel-wrapper').style.height = '120px';
            document.getElementById('wheel-wrapper').style.opacity = '0.5';
            
            // Restaurar Tablero
            document.getElementById('board-zone').classList.remove('board-dimmed');
            document.querySelectorAll('.board-cell').forEach(c => c.classList.remove('cell-fire', 'cell-winner'));
            
            const phaseText = document.getElementById('phase-text');
            phaseText.innerText = 'APUESTAS ABIERTAS 00:15';
            phaseText.className = 'absolute top-2 text-[10px] font-black uppercase tracking-[0.2em] text-blue-400 z-40 bg-zinc-900/80 px-3 py-1 rounded-full';
            
            clearBets(); // Deja listo para la próxima ronda
            
            // Resetea Rotación para GSAP
            gsap.set("#wheel-svg-container", { rotation: 0 });
            gameState = 'BETTING';
        }
    </script>
</body>
</html>
