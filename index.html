<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Mega Fire Roulette</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
            overscroll-behavior-y: contain;
            background-color: #050505;
            color: white;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* ANCLAS MENTALES: LOS JACKPOTS */
        .jackpot-bar {
            background: linear-gradient(90deg, #1a0505 0%, #450a0a 50%, #1a0505 100%);
            border-bottom: 2px solid #ef4444;
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.2);
        }
        .text-glow { text-shadow: 0 0 10px currentColor; }

        /* LA RULETA FÍSICA */
        .roulette-wrapper {
            position: relative; width: 300px; height: 300px; margin: 0 auto;
            border-radius: 50%; padding: 8px;
            background: conic-gradient(#f59e0b, #78350f, #f59e0b, #78350f, #f59e0b);
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.3), inset 0 0 20px rgba(0,0,0,0.9);
        }
        .roulette-wheel {
            width: 100%; height: 100%; border-radius: 50%;
            position: relative; overflow: hidden;
            transition: transform 5s cubic-bezier(0.2, 0.8, 0.1, 1);
            border: 4px solid #111;
        }
        
        /* Sectores CSS generados dinámicamente desde JS */
        .slot {
            position: absolute; top: 0; left: 50%;
            width: 25.4px; /* Aprox ancho para 37 slots */
            height: 50%;
            transform-origin: 50% 100%;
            clip-path: polygon(0 0, 100% 0, 50% 100%);
            display: flex; justify-content: center;
        }
        .slot span {
            margin-top: 5px; font-weight: 900; font-size: 11px;
            transform: rotate(0deg); color: white;
        }

        /* FLECHA Y CENTRO */
        .roulette-pointer {
            position: absolute; top: -15px; left: 50%; transform: translateX(-50%);
            width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent;
            border-top: 30px solid #fde047; z-index: 20; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.8));
        }
        .roulette-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 140px; height: 140px; border-radius: 50%;
            background: radial-gradient(circle, #27272a 0%, #000 100%);
            border: 3px solid #f59e0b; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        /* ESTADO FIRE NUMBER */
        @keyframes fire-pulse {
            0% { background-color: #ea580c; box-shadow: 0 0 10px #ea580c; }
            50% { background-color: #facc15; box-shadow: 0 0 25px #facc15, 0 0 10px #ea580c inset; }
            100% { background-color: #ea580c; box-shadow: 0 0 10px #ea580c; }
        }
        .is-fire {
            animation: fire-pulse 0.8s infinite alternate !important;
            z-index: 5;
        }
        .is-fire span { color: #000 !important; font-size: 13px; text-shadow: none; }

        /* RONDA DE BONUS (SLOT GRID) */
        .bonus-screen {
            background: radial-gradient(circle, #450a0a 0%, #000 100%);
            z-index: 100;
        }
        .bonus-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
            width: 280px; margin: 0 auto;
        }
        .bonus-cell {
            aspect-ratio: 1; background: rgba(0,0,0,0.5); border: 2px solid #b91c1c;
            border-radius: 10px; display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 900; box-shadow: inset 0 0 15px rgba(185,28,28,0.3);
            transition: all 0.3s;
        }
        .cell-filled {
            background: linear-gradient(135deg, #f59e0b, #ea580c); border-color: #fef08a;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.6); color: white;
            animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes pop-in { 0% { transform: scale(0); } 100% { transform: scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        
        .shake-active { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body class="w-screen overflow-hidden flex flex-col font-sans h-[100dvh]">

    <!-- PANTALLAS DE ESTADO -->
    <div id="loading-screen" class="absolute inset-0 z-[200] bg-black flex flex-col items-center justify-center">
        <div class="text-5xl animate-pulse mb-4">🔥</div>
        <p class="text-orange-500 font-bold uppercase tracking-widest animate-pulse text-sm">Cargando Mesa...</p>
    </div>
    <div id="error-screen" class="absolute inset-0 z-[200] bg-black flex flex-col items-center justify-center hidden">
        <h1 class="text-red-600 text-4xl font-extrabold mb-2 uppercase">Denegado</h1>
    </div>

    <!-- PANTALLA DE BONUS (Oculta por defecto) -->
    <div id="bonus-screen" class="absolute inset-0 bonus-screen hidden flex-col items-center justify-center">
        <h2 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-red-500 mb-2 uppercase text-center leading-none drop-shadow-[0_0_10px_rgba(239,68,68,0.8)]">
            Mega Fire<br>Bonus
        </h2>
        
        <div class="text-center mb-6">
            <span class="text-sm text-red-300 font-bold uppercase">Spins Restantes</span>
            <div id="bonus-spins" class="text-5xl font-black text-white">3</div>
        </div>

        <div class="bonus-grid" id="bonus-grid">
            <!-- 9 celdas generadas en JS -->
        </div>

        <div id="bonus-total-container" class="mt-8 text-center hidden flex-col items-center" style="animation: pop-in 0.5s forwards;">
            <span class="text-sm text-yellow-500 font-bold uppercase">Premio Total</span>
            <span id="bonus-total-win" class="text-6xl font-black text-white text-glow text-green-400">0</span>
            <button onclick="closeBonus()" class="mt-6 px-8 py-3 bg-green-600 font-black text-white rounded-full uppercase shadow-[0_0_20px_#16a34a]">Recoger</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app-screen" class="flex-1 flex flex-col relative hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-zinc-900 via-black to-black">
        
        <!-- JERARQUÍA DE JACKPOTS (Dopamina estática) -->
        <div class="jackpot-bar flex justify-between px-2 py-1 flex-none z-10">
            <div class="text-center"><div class="text-[8px] text-green-400 font-bold uppercase">Mini</div><div class="text-xs font-black text-white">x2</div></div>
            <div class="text-center"><div class="text-[8px] text-blue-400 font-bold uppercase">Minor</div><div class="text-xs font-black text-white">x5</div></div>
            <div class="text-center"><div class="text-[8px] text-purple-400 font-bold uppercase">Major</div><div class="text-xs font-black text-white">x20</div></div>
            <div class="text-center"><div class="text-[8px] text-red-500 font-bold uppercase text-glow">Grand</div><div class="text-sm font-black text-yellow-400 text-glow">x100</div></div>
        </div>

        <!-- HEADER JUGADOR -->
        <header class="px-4 py-2 border-b border-zinc-800 bg-black/80 flex-none flex justify-between items-center">
            <div>
                <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-wider">Jugador</span>
                <div id="player-name" class="text-sm font-bold text-zinc-300">...</div>
            </div>
            <div class="text-right">
                <span class="text-[10px] text-zinc-500 uppercase font-bold tracking-wider">Saldo</span>
                <div id="player-balance" class="text-xl font-black text-white">0</div>
            </div>
        </header>

        <!-- ZONA RULETA -->
        <main class="flex-1 flex flex-col items-center justify-center relative overflow-hidden w-full">
            
            <div class="roulette-wrapper shrink-0">
                <div class="roulette-pointer"></div>
                
                <!-- Rueda generada por JS -->
                <div id="wheel" class="roulette-wheel"></div>
                
                <div class="roulette-center">
                    <span class="text-[10px] text-zinc-400 font-bold uppercase mb-1">Apuesta</span>
                    <span id="center-bet" class="text-2xl font-black text-white">100</span>
                    <span id="fire-status" class="text-xs font-bold text-orange-500 uppercase mt-1 animate-pulse hidden">🔥 Fire 🔥</span>
                </div>
            </div>

            <!-- MENSAJES DE ESTADO (Casi, Ganaste, etc) -->
            <div id="status-message" class="absolute bottom-4 left-0 w-full text-center h-12 flex items-center justify-center">
                <!-- Inyectado por JS -->
            </div>

        </main>

        <!-- CONTROLES FIJOS -->
        <div class="bg-zinc-950 border-t border-zinc-800 px-4 pt-3 pb-8 flex-none z-20">
            <div class="flex justify-between gap-2 mb-3">
                <button onclick="setBet(100)" class="bet-btn bet-active flex-1 py-2 bg-zinc-900 border border-zinc-700 rounded text-zinc-300 font-bold transition-all text-sm">100</button>
                <button onclick="setBet(250)" class="bet-btn flex-1 py-2 bg-zinc-900 border border-zinc-700 rounded text-zinc-300 font-bold transition-all text-sm">250</button>
                <button onclick="setBet(500)" class="bet-btn flex-1 py-2 bg-zinc-900 border border-zinc-700 rounded text-zinc-300 font-bold transition-all text-sm">500</button>
                <button onclick="setBet(1000)" class="bet-btn flex-1 py-2 bg-zinc-900 border border-zinc-700 rounded text-zinc-300 font-bold transition-all text-sm">1K</button>
            </div>
            
            <button id="spin-btn" class="w-full h-16 bg-gradient-to-r from-red-600 to-red-700 active:from-red-800 active:to-red-900 rounded-lg shadow-[0_5px_0_#7f1d1d] active:shadow-[0_0px_0_#7f1d1d] active:translate-y-[5px] transition-all flex items-center justify-center disabled:opacity-50 disabled:grayscale">
                <span class="text-2xl font-black text-white tracking-widest uppercase">Girar Ruleta</span>
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // --- 1. CONFIGURACIÓN Y SUPABASE ---
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        // Variables Globales
        let currentUser = null;
        let isSpinning = false;
        let currentBet = 100;
        let currentRotation = 0; 
        
        // Estructura Ruleta Europea
        const ROULETTE_NUMS = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
        const SEGMENT_DEG = 360 / 37; // 9.729 grados
        
        // --- 2. INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', async () => {
            renderWheel();
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo');
            if (!codigoUrl) return document.getElementById('error-screen').classList.remove('hidden');

            const { data, error } = await supabaseClient.from('usuarios').select('*').eq('codigo', codigoUrl).single();
            if (error || !data) {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('error-screen').classList.remove('hidden');
            } else {
                currentUser = data;
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('app-screen').classList.remove('hidden');
                updateUI();
            }
        });

        // --- 3. DIBUJAR RULETA (CSS Dinámico) ---
        function renderWheel() {
            const wheel = document.getElementById('wheel');
            wheel.innerHTML = '';
            ROULETTE_NUMS.forEach((num, index) => {
                let color = (num === 0) ? '#16a34a' : (index % 2 === 0 ? '#171717' : '#dc2626');
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.id = `slot-${num}`;
                // Rotar el sector y darle color de fondo con bordes
                slot.style.transform = `rotate(${index * SEGMENT_DEG}deg)`;
                slot.style.background = color;
                
                const span = document.createElement('span');
                span.innerText = num;
                slot.appendChild(span);
                wheel.appendChild(slot);
            });
        }

        // --- 4. UI Y APUESTAS ---
        function setBet(amount) {
            if (isSpinning) return;
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.style.borderColor = parseInt(btn.innerText.replace('1K', '1000')) === amount ? '#ef4444' : '#3f3f46';
                btn.style.background = parseInt(btn.innerText.replace('1K', '1000')) === amount ? '#7f1d1d' : '#18181b';
            });
            document.getElementById('center-bet').innerText = amount;
        }

        function updateUI() {
            document.getElementById('player-name').innerText = currentUser.nombre;
            document.getElementById('player-balance').innerText = parseFloat(currentUser.saldo).toLocaleString('es-ES');
        }

        // --- 5. LÓGICA MATEMÁTICA INTACTA ---
        function getResultadoTirada(tiradas) {
            const rand = Math.random();
            let mult = 0; let tipo = '';
            if (tiradas <= 50) {
                if (rand < 0.20) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.50) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.90) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            } else {
                if (rand < 0.50) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.90) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.98) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            }
            return { mult, tipo };
        }

        // --- 6. EL MOTOR DE LA RULETA FIRE ---
        document.getElementById('spin-btn').addEventListener('click', () => {
            if (isSpinning) return;
            if (currentUser.saldo < currentBet) return alert('Saldo insuficiente.');

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;
            document.getElementById('status-message').innerHTML = '';

            // 1. Cobrar Inmediato
            currentUser.saldo -= currentBet;
            currentUser.tiradas_realizadas += 1;
            updateUI();

            // 2. Elegir 5 Fire Numbers Aleatorios
            document.querySelectorAll('.slot').forEach(el => el.classList.remove('is-fire'));
            const shuffled = [...ROULETTE_NUMS].sort(() => 0.5 - Math.random());
            const fireNumbers = shuffled.slice(0, 5);
            fireNumbers.forEach(n => document.getElementById(`slot-${n}`).classList.add('is-fire'));

            document.getElementById('fire-status').classList.remove('hidden');

            // 3. Resultado Matemático
            const { mult, tipo } = getResultadoTirada(currentUser.tiradas_realizadas);
            
            // 4. Determinar en qué casilla visual cae
            let targetNumber;
            if (mult > 0) {
                // SI GANA (x0.3, x1.2 o x5): Tiene que caer OBLIGATORIAMENTE en un Fire Number.
                targetNumber = fireNumbers[Math.floor(Math.random() * fireNumbers.length)];
            } else {
                // SI PIERDE (x0):
                // CASI-ACIERTO (Near Miss): 40% de probabilidad de caer EXACTAMENTE AL LADO de un Fire Number.
                if (Math.random() < 0.40) {
                    const fireAnchor = fireNumbers[0];
                    const idx = ROULETTE_NUMS.indexOf(fireAnchor);
                    // Coge el de la derecha o izquierda
                    targetNumber = ROULETTE_NUMS[(idx + (Math.random() < 0.5 ? 1 : -1) + 37) % 37];
                    // Si por casualidad ese también es Fire, cogemos uno aleatorio normal
                    if (fireNumbers.includes(targetNumber)) {
                        targetNumber = shuffled.find(n => !fireNumbers.includes(n));
                    }
                } else {
                    targetNumber = shuffled.find(n => !fireNumbers.includes(n));
                }
            }

            // 5. Girar la Ruleta
            const targetIndex = ROULETTE_NUMS.indexOf(targetNumber);
            // El ángulo al que hay que ir. Se le resta a 360 porque CSS gira horario y queremos que quede bajo la flecha superior.
            const angleToTarget = 360 - (targetIndex * SEGMENT_DEG); 
            // Añadir vueltas extra (3600 = 10 vueltas)
            const spinAmount = 3600 + angleToTarget;
            currentRotation += spinAmount - (currentRotation % 360);
            
            document.getElementById('wheel').style.transform = `rotate(${currentRotation}deg)`;
            if (navigator.vibrate) navigator.vibrate(50);

            // 6. Al detenerse (5 segundos)
            setTimeout(() => {
                document.getElementById('fire-status').classList.add('hidden');
                
                if (mult > 0) {
                    // Cae en Fuego -> BONUS
                    startBonusRound(mult, currentBet * mult, tipo);
                } else {
                    // Pierde -> Verificar si fue Near Miss visualmente
                    const targetIdx = ROULETTE_NUMS.indexOf(targetNumber);
                    const isNearMiss = fireNumbers.includes(ROULETTE_NUMS[(targetIdx + 1) % 37]) || fireNumbers.includes(ROULETTE_NUMS[(targetIdx - 1 + 37) % 37]);
                    
                    if (isNearMiss) {
                        document.getElementById('status-message').innerHTML = `<span class="text-xl font-bold text-zinc-400">¡Uff... Casi!</span>`;
                    }
                    
                    finalizeSpin();
                }
            }, 5200);
        });

        // --- 7. LA RONDA DE BONUS (El truco psicológico) ---
        let finalPrizeAmount = 0;
        
        function startBonusRound(mult, totalPrize, tipo) {
            finalPrizeAmount = totalPrize;
            const grid = document.getElementById('bonus-grid');
            grid.innerHTML = '';
            for(let i=0; i<9; i++) grid.innerHTML += `<div class="bonus-cell" id="cell-${i}"></div>`;
            
            document.getElementById('bonus-total-container').classList.add('hidden');
            document.getElementById('bonus-spins').innerText = '3';
            document.getElementById('bonus-screen').classList.remove('hidden');
            document.getElementById('bonus-screen').classList.add('flex');

            // Determinar qué cae según el premio (Fragmentación del premio)
            let drops = [];
            if (tipo === 'false-win') { // x0.3
                drops = [ {val: `x0.3`, class: 'text-white'} ];
            } else if (tipo === 'win-normal') { // x1.2
                drops = [ {val: 'x0.5', class: ''}, {val: 'x0.5', class: ''}, {val: 'x0.2', class: ''} ];
            } else if (tipo === 'win-mega') { // x5
                drops = [ {val: 'x1', class: ''}, {val: 'x2', class: ''}, {val: 'MINI', class: 'text-green-400 text-sm'} ];
            }

            let spinCount = 3;
            let dropIndex = 0;
            const availableCells = [0,1,2,3,4,5,6,7,8].sort(() => 0.5 - Math.random());

            const interval = setInterval(() => {
                spinCount--;
                document.getElementById('bonus-spins').innerText = spinCount;
                if (navigator.vibrate) navigator.vibrate(30);
                
                // Efecto Shake en la UI
                document.getElementById('bonus-screen').classList.add('shake-active');
                setTimeout(() => document.getElementById('bonus-screen').classList.remove('shake-active'), 300);

                if (dropIndex < drops.length && spinCount > 0) {
                    // Cae un premio, el contador se "reinicia" (ilusión)
                    const cell = document.getElementById(`cell-${availableCells[dropIndex]}`);
                    cell.classList.add('cell-filled');
                    cell.innerHTML = `<span class="${drops[dropIndex].class}">${drops[dropIndex].val}</span>`;
                    dropIndex++;
                    spinCount = 3; // Respin mechanic
                    document.getElementById('bonus-spins').innerText = spinCount;
                    if (navigator.vibrate) navigator.vibrate([50, 50, 100]);
                }

                if (spinCount <= 0 || dropIndex >= drops.length) {
                    clearInterval(interval);
                    setTimeout(() => {
                        document.getElementById('bonus-total-win').innerText = totalPrize.toLocaleString();
                        document.getElementById('bonus-total-container').classList.remove('hidden');
                        document.getElementById('bonus-total-container').classList.add('flex');
                        if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
                    }, 1000);
                }
            }, 1200);
        }

        async function closeBonus() {
            document.getElementById('bonus-screen').classList.add('hidden');
            document.getElementById('bonus-screen').classList.remove('flex');
            
            currentUser.saldo += finalPrizeAmount;
            updateUI();
            finalizeSpin();
        }

        async function finalizeSpin() {
            isSpinning = false;
            document.getElementById('spin-btn').disabled = false;
            
            await supabaseClient.from('usuarios').update({ 
                saldo: currentUser.saldo, tiradas_realizadas: currentUser.tiradas_realizadas 
            }).eq('id', currentUser.id);
        }
    </script>
</body>
</html>
