<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ruleta Casino Pro</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        /* Desactivar comportamientos nativos molestos */
        body {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            overscroll-behavior-y: contain;
            background-color: #0a0a0a; /* Negro casino profundo */
        }

        /* FONDO ESTILO TAPETE CASINO (Rojo Oscuro Radial) */
        .casino-bg {
            background: radial-gradient(circle at center, #450a0a 0%, #000000 100%);
        }

        /* DISEÑO PREMIUM DE LA RULETA */
        .roulette-container {
            position: relative;
            width: 270px;
            height: 270px;
            margin: 0 auto;
            border-radius: 50%;
            padding: 10px;
            background: linear-gradient(135deg, #fbbf24 0%, #b45309 50%, #fbbf24 100%); /* Borde Oro Macizo */
            box-shadow: 0 15px 35px rgba(0,0,0,0.8), inset 0 0 10px rgba(0,0,0,0.8);
        }

        .roulette-wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            /* Colores Reales de Casino: Verde, Negro, Rojo */
            background: conic-gradient(
                #16a34a 0deg 45deg,    /* VERDE x5 */
                #171717 45deg 90deg,   /* NEGRO x0 */
                #dc2626 90deg 135deg,  /* ROJO x1.2 */
                #262626 135deg 180deg, /* NEGRO MATE x0.3 */
                #16a34a 180deg 225deg, /* VERDE x5 */
                #171717 225deg 270deg, /* NEGRO x0 */
                #dc2626 270deg 315deg, /* ROJO x1.2 */
                #262626 315deg 360deg  /* NEGRO MATE x0.3 */
            );
            box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
            transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1);
            position: relative;
            overflow: hidden;
            border: 2px solid #000;
        }

        /* Textos dentro de la ruleta */
        .slice-text {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: 900;
            font-size: 1.3rem;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            transform-origin: 50% 50%;
            display: flex;
            justify-content: center;
        }
        .slice-text span { padding-top: 10px; }

        /* El Marcador (Dorado y brillante) */
        .roulette-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid #fbbf24;
            z-index: 20;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.8));
        }
        .roulette-pointer::after {
            content: ''; position: absolute; top: -35px; left: -12px;
            border-left: 12px solid transparent; border-right: 12px solid transparent;
            border-top: 25px solid #fef08a; /* Brillo interior */
        }

        /* EFECTOS DE DOPAMINA */
        @keyframes pop-in {
            0% { transform: scale(0.1); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; filter: brightness(2); }
            100% { transform: scale(1); opacity: 1; filter: brightness(1); }
        }
        
        @keyframes strobe {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.3; background: #fbbf24; }
        }
        .strobe-active { animation: strobe 0.2s infinite; }

        /* LLUVIA DE MONEDAS */
        .coin {
            position: absolute;
            width: 30px; height: 30px;
            background: radial-gradient(circle, #fef08a 0%, #eab308 50%, #a16207 100%);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 0 5px rgba(255,255,255,0.8);
            z-index: 100;
            animation: fall linear forwards;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
        }

        /* Estilo activo para apuestas */
        .bet-active { border-color: #fbbf24 !important; background: #713f12 !important; color: #fbbf24 !important; box-shadow: 0 0 15px rgba(251,191,36,0.4); }
        
        .popup-overlay { background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
    </style>
</head>
<body class="text-white w-screen overflow-hidden flex flex-col items-center justify-center font-sans">

    <!-- DESTELLO DE PREMIO (Fondo oculto que parpadea al ganar) -->
    <div id="strobe-light" class="fixed inset-0 pointer-events-none z-30 opacity-0 transition-opacity"></div>

    <!-- PANTALLAS DE ESTADO -->
    <div id="loading-screen" class="absolute inset-0 z-50 bg-black flex flex-col items-center justify-center">
        <div class="w-16 h-16 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mb-4"></div>
        <p class="text-yellow-500 font-bold uppercase tracking-widest animate-pulse">Entrando al Casino...</p>
    </div>

    <div id="error-screen" class="absolute inset-0 z-40 bg-black flex flex-col items-center justify-center hidden">
        <h1 class="text-red-600 text-4xl font-extrabold mb-2 uppercase">Acceso Denegado</h1>
    </div>

    <!-- APP PRINCIPAL (Usando 100dvh para iPhone XS) -->
    <div id="app-screen" class="w-full max-w-md mx-auto flex flex-col relative hidden casino-bg" style="height: 100dvh;">
        
        <!-- HEADER -->
        <header class="px-4 py-3 border-b border-red-900/50 bg-black/40 z-10 flex-none shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <div class="flex flex-col">
                    <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">VIP JUGADOR</span>
                    <span id="player-name" class="text-sm font-bold text-white truncate max-w-[120px] text-yellow-500">...</span>
                </div>
                <div class="flex flex-col items-end">
                    <span class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">SALDO TOTAL</span>
                    <span id="player-balance" class="text-2xl font-black text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">0</span>
                </div>
            </div>

            <!-- BARRA DE PROGRESO -->
            <div class="w-full bg-black rounded-full h-2.5 mb-1 overflow-hidden border border-slate-800 relative shadow-inner">
                <div id="progress-bar" class="bg-gradient-to-r from-red-600 to-yellow-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <div class="flex justify-between items-center mt-1">
                <span id="progress-text" class="text-[10px] font-bold text-slate-400 uppercase">Rollover: 0.0%</span>
                <button id="withdraw-btn" onclick="alert('Contacta por WhatsApp para tramitar tu retiro VIP.');" class="hidden text-[10px] bg-green-500 text-black font-extrabold px-3 py-1 rounded shadow-[0_0_15px_rgba(34,197,94,0.8)] uppercase animate-pulse">
                    ¡Retirar Dinero!
                </button>
            </div>
        </header>

        <!-- ZONA CENTRAL SCROLL (Evita apreturas en móviles pequeños) -->
        <main class="flex-1 flex flex-col items-center justify-evenly py-2 overflow-y-auto w-full">
            
            <!-- TABLA DE PREMIOS (Incentivo visual) -->
            <div class="w-full px-4 mb-2">
                <div class="grid grid-cols-2 gap-2 text-center text-[10px] font-bold uppercase tracking-wider">
                    <div class="bg-black/60 border border-green-500/50 rounded-lg p-2 shadow-[0_0_15px_rgba(34,197,94,0.2)]">
                        <span class="text-green-400 block mb-1 drop-shadow-md">🍀 MEGA x5</span>
                        <span id="prize-mega" class="text-white text-lg font-black">500</span> pts
                    </div>
                    <div class="bg-black/60 border border-red-500/50 rounded-lg p-2 shadow-[0_0_15px_rgba(220,38,38,0.2)]">
                        <span class="text-red-400 block mb-1 drop-shadow-md">🔥 WIN x1.2</span>
                        <span id="prize-win" class="text-white text-lg font-black">120</span> pts
                    </div>
                    <div class="bg-black/60 border border-slate-400/50 rounded-lg p-2 shadow-[0_0_10px_rgba(255,255,255,0.1)]">
                        <span class="text-slate-300 block mb-1">PREMIO x0.3</span>
                        <span id="prize-false" class="text-white text-lg font-black">30</span> pts
                    </div>
                    <div class="bg-black/60 border border-slate-700/50 rounded-lg p-2 opacity-50">
                        <span class="text-slate-500 block mb-1">PIERDE x0</span>
                        <span id="prize-loss" class="text-slate-400 text-lg font-black">0</span> pts
                    </div>
                </div>
            </div>

            <!-- LA RULETA -->
            <div class="roulette-container shrink-0 my-2">
                <div class="roulette-pointer"></div>
                <div id="wheel" class="roulette-wheel">
                    <div class="slice-text" style="transform: rotate(22.5deg);"><span class="text-white">x5</span></div>
                    <div class="slice-text" style="transform: rotate(67.5deg);"><span class="text-slate-500">x0</span></div>
                    <div class="slice-text" style="transform: rotate(112.5deg);"><span class="text-white">x1.2</span></div>
                    <div class="slice-text" style="transform: rotate(157.5deg);"><span class="text-slate-400">x0.3</span></div>
                    <div class="slice-text" style="transform: rotate(202.5deg);"><span class="text-white">x5</span></div>
                    <div class="slice-text" style="transform: rotate(247.5deg);"><span class="text-slate-500">x0</span></div>
                    <div class="slice-text" style="transform: rotate(292.5deg);"><span class="text-white">x1.2</span></div>
                    <div class="slice-text" style="transform: rotate(337.5deg);"><span class="text-slate-400">x0.3</span></div>
                </div>
                <!-- Centro de la ruleta (Bronce/Oro) -->
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-12 h-12 bg-gradient-to-br from-yellow-600 to-yellow-900 rounded-full border-2 border-black z-10 shadow-[0_0_15px_rgba(0,0,0,1)] flex items-center justify-center">
                    <div class="w-4 h-4 bg-black rounded-full"></div>
                </div>
            </div>

        </main>

        <!-- CONTROLES ABAJO (Fijados y adaptados para iPhone XS con pb-safe) -->
        <div class="bg-black border-t-2 border-red-900 px-4 pt-4 pb-8 flex-none shadow-[0_-10px_30px_rgba(0,0,0,0.8)] z-20">
            
            <p class="text-center text-[11px] text-yellow-500 uppercase font-black mb-3 tracking-widest">Elige tu Apuesta</p>
            <div class="flex justify-between gap-2 mb-4">
                <button onclick="setBet(100)" class="bet-btn bet-active flex-1 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white font-black transition-all text-sm shadow-md">100</button>
                <button onclick="setBet(250)" class="bet-btn flex-1 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white font-black transition-all text-sm shadow-md">250</button>
                <button onclick="setBet(500)" class="bet-btn flex-1 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white font-black transition-all text-sm shadow-md">500</button>
                <button onclick="setBet(1000)" class="bet-btn flex-1 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white font-black transition-all text-sm shadow-md">1K</button>
            </div>

            <!-- Botón TIRAR GIGANTE ESTILO TRAGAPERRAS -->
            <button id="spin-btn" class="w-full h-16 bg-gradient-to-b from-green-500 to-green-700 active:from-green-600 active:to-green-800 rounded-xl shadow-[0_6px_0_#14532d,0_15px_20px_rgba(0,0,0,0.6)] active:shadow-[0_0px_0_#14532d,0_5px_10px_rgba(0,0,0,0.6)] active:translate-y-[6px] transition-all flex flex-col items-center justify-center border border-green-400 select-none disabled:opacity-50 disabled:grayscale" style="-webkit-tap-highlight-color: transparent;">
                <span class="text-3xl font-black text-white tracking-widest drop-shadow-[0_2px_2px_rgba(0,0,0,0.8)]">TIRAR</span>
            </button>
            
            <!-- Espacio extra de seguridad para iOS (iPhone XS line) -->
            <div class="h-4"></div>
        </div>

        <!-- POPUP RESULTADO (Lleno de Dopamina) -->
        <div id="result-popup" class="absolute inset-0 z-50 popup-overlay flex-col items-center justify-center hidden">
            <div id="result-content" class="text-center flex flex-col items-center justify-center" style="animation: pop-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;">
                <!-- Se inyecta por JS -->
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT -->
    <script>
        // 1. CONFIGURACIÓN
        const { createClient } = supabase;
        const supabaseUrl = 'https://qutkwzjchchhbqfhtaxi.supabase.co';
        const supabaseKey = 'sb_publishable_fv4VSDx-LJrkorzY0bOKaA_0poFJcU1';
        const supabaseClient = createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        let isSpinning = false;
        let currentBet = 100;
        let currentRotation = 0; 

        const elApp = document.getElementById('app-screen');
        const wheelEl = document.getElementById('wheel');
        const popup = document.getElementById('result-popup');
        const popupContent = document.getElementById('result-content');
        const strobeLight = document.getElementById('strobe-light');

        // 2. INICIALIZACIÓN
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const codigoUrl = urlParams.get('codigo');
            if (!codigoUrl) return document.getElementById('error-screen').classList.remove('hidden');

            const { data, error } = await supabaseClient.from('usuarios').select('*').eq('codigo', codigoUrl).single();

            if (error || !data) {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('error-screen').classList.remove('hidden');
            } else {
                currentUser = data;
                document.getElementById('loading-screen').classList.add('hidden');
                elApp.classList.remove('hidden');
                updatePrizeBoard();
                updateUI();
            }
        });

        // 3. APUESTAS
        function setBet(amount) {
            if (isSpinning) return;
            currentBet = amount;
            document.querySelectorAll('.bet-btn').forEach(btn => {
                btn.classList.toggle('bet-active', parseInt(btn.innerText.replace('1K', '1000')) === amount);
            });
            updatePrizeBoard();
        }

        function updatePrizeBoard() {
            document.getElementById('prize-mega').textContent = (currentBet * 5).toLocaleString('es-ES');
            document.getElementById('prize-win').textContent = (currentBet * 1.2).toLocaleString('es-ES');
            document.getElementById('prize-false').textContent = (currentBet * 0.3).toLocaleString('es-ES');
        }

        function updateUI() {
            document.getElementById('player-name').textContent = currentUser.nombre;
            document.getElementById('player-balance').textContent = parseFloat(currentUser.saldo).toLocaleString('es-ES');

            let porcentaje = (currentUser.tiradas_realizadas / currentUser.tiradas_objetivo) * 100;
            if (porcentaje > 100) porcentaje = 100;
            
            document.getElementById('progress-bar').style.width = `${porcentaje}%`;
            document.getElementById('progress-text').textContent = `Rollover: ${porcentaje.toFixed(1)}%`;
            if (porcentaje >= 100) document.getElementById('withdraw-btn').classList.remove('hidden');
        }

        // 4. MATEMÁTICAS
        function getResultadoTirada(tiradas) {
            const rand = Math.random();
            let mult = 0; let tipo = '';
            
            if (tiradas <= 50) {
                if (rand < 0.20) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.50) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.90) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            } else {
                if (rand < 0.50) { mult = 0; tipo = 'loss'; }
                else if (rand < 0.90) { mult = 0.3; tipo = 'false-win'; }
                else if (rand < 0.98) { mult = 1.2; tipo = 'win-normal'; }
                else { mult = 5; tipo = 'win-mega'; }
            }
            return { mult, tipo };
        }

        // LLUVIA DE MONEDAS CSS
        function spawnCoins(amount) {
            const count = amount > 200 ? 40 : 20; // Si el premio es grande, caen más monedas
            for(let i=0; i<count; i++) {
                const coin = document.createElement('div');
                coin.className = 'coin';
                coin.style.left = Math.random() * 100 + 'vw';
                coin.style.animationDuration = (Math.random() * 1 + 1) + 's';
                coin.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(coin);
                setTimeout(() => coin.remove(), 2000); // Limpieza
            }
        }

        // 5. GIRAR RULETA
        document.getElementById('spin-btn').addEventListener('click', () => {
            if (isSpinning) return;
            if (currentUser.saldo < currentBet) return alert('Saldo insuficiente.');

            isSpinning = true;
            document.getElementById('spin-btn').disabled = true;

            currentUser.saldo -= currentBet;
            currentUser.tiradas_realizadas += 1;
            updateUI();

            const { mult, tipo } = getResultadoTirada(currentUser.tiradas_realizadas);
            const premioFinal = currentBet * mult;

            // Mapeo exacto de los colores visuales
            let angleToLand = 0;
            const rnd = Math.random() < 0.5;
            if (mult === 5) angleToLand = rnd ? 22.5 : 202.5; // Verde
            else if (mult === 0) angleToLand = rnd ? 67.5 : 247.5; // Negro
            else if (mult === 1.2) angleToLand = rnd ? 112.5 : 292.5; // Rojo
            else if (mult === 0.3) angleToLand = rnd ? 157.5 : 337.5; // Negro

            const spinAmount = 3600 + (360 - angleToLand);
            currentRotation += spinAmount - (currentRotation % 360);
            
            wheelEl.style.transform = `rotate(${currentRotation}deg)`;
            
            if (navigator.vibrate) navigator.vibrate(50);

            // Al frenar (4 segundos exactos según CSS)
            setTimeout(async () => {
                
                let popupHtml = '';
                if (tipo === 'win-mega') {
                    popupHtml = `<span class="text-7xl font-black mb-2 uppercase text-green-400 drop-shadow-[0_0_20px_#16a34a]">¡MEGA!</span><span class="text-5xl font-bold text-white drop-shadow-md">+${premioFinal}</span>`;
                    strobeLight.classList.add('strobe-active');
                    spawnCoins(premioFinal);
                }
                else if (tipo === 'win-normal') {
                    popupHtml = `<span class="text-6xl font-black mb-2 uppercase text-red-500 drop-shadow-[0_0_20px_#dc2626]">¡GANASTE!</span><span class="text-5xl font-bold text-white drop-shadow-md">+${premioFinal}</span>`;
                    spawnCoins(premioFinal);
                }
                else if (tipo === 'false-win') {
                    // DOPAMINA PARA EL FALSO PREMIO
                    popupHtml = `<span class="text-6xl font-black mb-2 uppercase text-yellow-400 drop-shadow-[0_0_20px_#facc15]">¡PREMIO!</span><span class="text-5xl font-bold text-white drop-shadow-md">+${premioFinal}</span>`;
                    spawnCoins(premioFinal);
                }
                else {
                    popupHtml = `<span class="text-5xl font-black uppercase mb-2 text-slate-500">CASI...</span><span class="text-2xl text-slate-400">Inténtalo de nuevo</span>`;
                }

                popupContent.innerHTML = popupHtml;
                popup.classList.remove('hidden');
                popup.classList.add('flex');

                if (premioFinal > 0 && navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 100]);

                setTimeout(async () => {
                    popup.classList.add('hidden');
                    popup.classList.remove('flex');
                    strobeLight.classList.remove('strobe-active');
                    
                    currentUser.saldo += premioFinal;
                    updateUI();
                    
                    isSpinning = false;
                    document.getElementById('spin-btn').disabled = false;

                    await supabaseClient.from('usuarios').update({ 
                        saldo: currentUser.saldo, tiradas_realizadas: currentUser.tiradas_realizadas 
                    }).eq('id', currentUser.id);

                }, 1800); // Tiempo del popup

            }, 4000); // Tiempo de ruleta rodando
        });
    </script>
</body>
</html>
